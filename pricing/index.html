eholder until real per-AHJ mandatory counts are loaded. Total (Building) is each property's real year-1 total; these rows sum to the priced Inspection total below exactly.</p>\n        </div>\n        ${confirmedCount>0?renderInspectionPricingDetail(li,w.contractTermYears,true):""}\n      </div>\n    </div>`}const lines=w.taskLines[svcId]||[];return`\n  <div class="card" style="margin-top:14px;">\n    <div class="card-header"><h3 class="card-title">${svc.name}</h3><span style="font-size:11px; color:var(--text-muted);">${fmtMoney(taskLineTotal(svcId))} total</span></div>\n    <div class="card-pad">\n      <p style="color:var(--text-muted); font-size:11px; margin:0 0 10px 0;">Open task-line schedule — mirrors the real VDA Project task-line pattern. Add lines from the catalog or type a custom name.</p>\n      ${lines.length?`\n      <div class="table-card">\n        <table class="data-table">\n          <thead><tr><th>Task / Service</th><th class="num">Amount</th><th>Billing Split</th><th>Trigger Type</th><th></th></tr></thead>\n          <tbody>\n            ${lines.map(l=>`\n              <tr>\n                <td>\n                  <select class="select-input" onchange="updateTaskLine('${svcId}','${l.id}','name',this.value)">\n                    ${TASK_LINE_CATALOG.map(c=>`<option ${l.name===c?"selected":""}>${c}</option>`).join("")}\n                  </select>\n                </td>\n                <td class="num"><input id="taskline-amt-${svcId}-${l.id}" class="text-input" style="text-align:right; width:100px; display:inline-block;" type="text" inputmode="numeric" value="${Number(l.amount||0).toLocaleString("en-US")}" oninput="formatCurrencyInput(this)" onchange="updateTaskLine('${svcId}','${l.id}','amount',currencyInputToNumber(this.value))"></td>\n                <td><select class="select-input" onchange="updateTaskLine('${svcId}','${l.id}','billingSplit',this.value)">${BILLING_SPLITS.map(b=>`<option ${l.billingSplit===b?"selected":""}>${b}</option>`).join("")}</select></td>\n                <td><select class="select-input" onchange="updateTaskLine('${svcId}','${l.id}','trigger',this.value)">${TRIGGER_TYPES.map(t=>`<option ${l.trigger===t?"selected":""}>${t}</option>`).join("")}</select></td>\n                <td><button class="btn btn-sm btn-ghost" onclick="removeTaskLine('${svcId}','${l.id}')">${icon("close")}</button></td>\n              </tr>`).join("")}\n          </tbody>\n        </table>\n      </div>`:`<div class="empty-state" style="padding:22px;"><div class="ic">☷</div>No task lines yet.</div>`}\n      <button class="btn btn-sm" style="margin-top:10px;" onclick="addTaskLine('${svcId}')">+ Add Task Line</button>\n      ${renderYearBreakoutBlock(svcId,taskLineTotal(svcId))}\n    </div>\n  </div>`}function renderTravelCard(totals){const w=state.wizard;const li=(totals.lineItems||[]).find(x=>x.svc&&x.svc.pricingModel==="travel");if(!li)return"";const d=li.detail||{perSite:[],totalCost:0,mileageRate:0,overnightRate:0,avgMph:65,overnightThresholdHours:3};const billed=(d.perSite||[]).filter(s=>s.billed);const notBilled=(d.perSite||[]).length-billed.length;const anyOvernight=billed.some(s=>s.overnightTriggered);return`\n  <div class="card" style="margin-top:14px;">\n    <div class="card-header">\n      <h3 class="card-title" style="margin:0;">Travel</h3>\n      <div style="font-weight:750; font-size:14px;">${fmtMoney(d.totalCost)}</div>\n    </div>\n    <div class="card-pad">\n      <p style="color:var(--text-muted); font-size:11px; margin:0 0 6px 0;">Round-trip mileage from the nearest available consultant, at the rate card's mileage rate (${fmtMoneyDec(d.mileageRate)}/mi), charged only when one-way distance exceeds 50 miles.${notBilled>0?` ${notBilled} propert${notBilled===1?"y falls":"ies fall"} under that threshold and carr${notBilled===1?"ies":"y"} no travel cost.`:""}</p>\n      \n      <p style="color:var(--text-muted); font-size:11px; margin:0 0 10px 0;">Drive time is estimated at ${d.avgMph}mph average from that same one-way distance. One-way drive time ≥ ${d.overnightThresholdHours} hours adds one night at the rate card's overnight rate (${fmtMoney(d.overnightRate)}).</p>\n      ${billed.length?`\n      <div class="table-card">\n        <table class="data-table">\n          <thead><tr><th>Property</th><th>City, State</th><th>Consultant</th><th class="num">One-way</th><th class="num">Drive time</th><th class="num">Round-trip</th><th class="num">Mileage</th><th class="num">Overnight</th><th class="num">Cost</th></tr></thead>\n          <tbody>\n            ${billed.map(s=>`<tr><td>${escapeHtml(s.property||"—")}</td><td>${escapeHtml([s.city,s.state].filter(Boolean).join(", "))||"—"}</td><td>${escapeHtml(s.code||"—")}</td><td class="num">${s.oneWayMiles} mi</td><td class="num" style="${s.overnightTriggered?"color:var(--amber); font-weight:650;":""}">${s.driveTimeHours}h</td><td class="num">${s.roundTripMiles} mi</td><td class="num">${fmtMoney(s.mileageCost)}</td><td class="num">${s.overnightTriggered?fmtMoney(s.overnightCost):"—"}</td><td class="num" style="font-weight:650;">${fmtMoney(s.cost)}</td></tr>`).join("")}\n          </tbody>\n        </table>\n      </div>\n      ${anyOvernight?`<p style="color:var(--amber); font-size:10.5px; margin:8px 0 0 0;">${icon("warn")} One or more properties trigger an overnight stay (one-way drive time ≥ ${d.overnightThresholdHours}h).</p>`:""}\n      `:`<div class="empty-state" style="padding:18px;"><div class="ic">☷</div>No properties currently exceed the 50-mile travel threshold.</div>`}\n    </div>\n  </div>`}function deliverableLabel(id){return id==="estimate"?"Estimate Sheet":id==="proposaldoc"?"Proposal (Word)":id==="travelBackup"?"Travel Backup":"Narrative Proposal"}function toggleDeliverable(id){const sel=state.wizard.deliverables;const next=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];setWizard({deliverables:next.length?next:sel})}function renderWizardStep4(){const w=state.wizard;const totals=computeOfferTotals();setActiveCurrencyContext(w);return`\n  <div class="card card-pad">\n    <h2 class="section-title" style="margin-bottom:4px;">What should PULSE generate?</h2>\n    <p style="color:var(--text-muted); font-size:12px; margin:0 0 16px 0;">Check as many as you need — these are two independent deliverables, not an either/or choice. Most offers will want at least the Estimate Sheet, since it's the only one that includes real pricing today.</p>\n    <div style="display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px;">\n      <div class="deliverable-choice ${w.deliverables.includes("proposaldoc")?"selected":""}" onclick="toggleDeliverable('proposaldoc')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("proposaldoc")?icon("check"):""}</div><div class="tc-title">Proposal (Word)</div></div>\n        <div class="tc-desc">One combined proposal for every selected service: title page, scope, fees, terms, signature page, billing form and invoice. Downloads as an editable Word file.</div>\n      </div>\n      <div class="deliverable-choice ${w.deliverables.includes("estimate")?"selected":""}" onclick="toggleDeliverable('estimate')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("estimate")?icon("check"):""}</div><div class="tc-title">Estimate Sheet</div></div>\n        <div class="tc-desc">A pricing-focused commercial summary — services, rate basis, line items, discount applied, total. Client-ready.</div>\n      </div>\n      <div class="deliverable-choice ${w.deliverables.includes("proposal")?"selected":""}" onclick="toggleDeliverable('proposal')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("proposal")?icon("check"):""}</div><div class="tc-title">Narrative Proposal</div></div>\n        <div class="tc-desc">Pricing &amp; commercial sections only (scope of services, commercial model, payment milestones, performance timeline) in an RFI-response style document. Narrative sections like team bios and risk registers are left as fill-in-later.</div>\n      </div>\n      <div class="deliverable-choice ${w.deliverables.includes("travelBackup")?"selected":""}" onclick="toggleDeliverable('travelBackup')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("travelBackup")?icon("check"):""}</div><div class="tc-title">Pricing &amp; Travel Backup Detail</div></div>\n        <div class="tc-desc">Internal document — pricing summary plus a per-property Travel Backup Detail table. Sales/Admin editions differ only in whether the nearest consultant shows by code or by name.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style="max-width:840px; margin: 14px auto 0 auto; display:flex; flex-direction:column; gap:20px;">\n    ${w.deliverables.includes("proposaldoc")?renderProposalSectionHTML(w):""}\n    ${w.deliverables.includes("estimate")?`\n    <div>\n      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">\n        <button class="btn btn-sm" onclick="downloadDocumentPDF('estimate-sheet-doc')"><i class="ti ti-download"></i> Download PDF</button>\n      </div>\n      <div id="estimate-sheet-doc">${renderEstimateSheetHTML()}</div>\n    </div>`:""}\n    ${w.deliverables.includes("proposal")?`\n    <div>\n      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">\n        <button class="btn btn-sm" onclick="downloadDocumentPDF('narrative-proposal-doc')"><i class="ti ti-download"></i> Download PDF</button>\n      </div>\n      <div id="narrative-proposal-doc">${renderNarrativeProposalHTML()}</div>\n    </div>`:""}\n    ${w.deliverables.includes("travelBackup")?`\n    <div>\n      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">\n        <button class="btn btn-sm" onclick="downloadDocumentPDF('travel-backup-doc')"><i class="ti ti-download"></i> Download PDF</button>\n      </div>\n      <div id="travel-backup-doc">${renderTravelBackupDetailHTML()}</div>\n    </div>`:""}\n  </div>\n\n  <div style="display:flex; justify-content:space-between; margin-top:18px;">\n    <button class="btn" onclick="wizardStep(3)">&larr; Back to Services &amp; Pricing</button>\n    <button class="btn btn-primary" ${w.generating?"disabled":""} onclick="confirmGenerateOffer()">${w.generating?"Generating…":"Confirm &amp; Generate Offer"}</button>\n  </div>`}function downloadDocumentPDF(elementId){document.querySelectorAll(".print-target").forEach(el=>el.classList.remove("print-target"));const el=document.getElementById(elementId);if(!el){showToast("Could not find that document to print.",true);return}el.classList.add("print-target");window.print()}async function confirmGenerateOffer(){const w=state.wizard;if(w.generating)return;if(!w.pricingResult||w.pricingLoading){showToast("Pricing is still loading — wait a moment and try again.",true);return}w.generating=true;render();const units=currentUnits();const body={clientName:w.clientName,portfolioName:w.offerType==="single"?null:w.portfolioName,offerType:w.offerType,siteCount:w.offerType==="single"?1:new Set(units.map(u=>u.property)).size,unitCount:units.length,contractTermYears:w.contractTermYears,totals:computeOfferTotals(),pricingInputs:buildPricingBody(w),deliverables:w.deliverables,discountTiers:w.offerType==="portfolio"?w.discountTiers:[],draftId:w.draftId};try{const res=await workerFetch("/api/offers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await res.json();if(!res.ok){showToast(data.error||"Could not save this offer.",true);w.generating=false;if(res.status===409)refreshPricing();render();return}showToast(`Offer ${data.id} created.`);setState({view:"offer-detail",activeOfferId:data.id,offerDetail:data})}catch(e){showToast("Could not reach the server. Check your connection and try again.",true);w.generating=false;render()}}async function saveDraftAndExit(){const w=state.wizard;if(w.draftSaving)return;const payload=JSON.stringify({...w,draftSaving:false});w.draftSaving=true;render();try{const res=w.draftId?await workerFetch(`/api/offer-drafts/${w.draftId}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:payload}):await workerFetch("/api/offer-drafts",{method:"POST",headers:{"Content-Type":"application/json"},body:payload});const data=await res.json();if(!res.ok){showToast(data&&data.error||"Could not save this draft.",true);w.draftSaving=false;render();return}showToast("Draft saved.");goTo("offers")}catch(e){showToast("Could not reach the server. Check your connection and try again.",true);w.draftSaving=false;render()}}function renderEstimateSheetHTML(){const w=state.wizard;const totals=computeOfferTotals();const units=currentUnits();const today=(new Date).toISOString().slice(0,10);return`\n  <div class="estimate-sheet">\n    <div class="es-header">\n      <div class="es-brand">\n        <div class="es-brand-mark">P</div>\n        <div><h1>Service Estimate</h1><div style="font-size:11px; color:var(--text-muted);">PULSE Pricing · VDA Elevator/Escalator Consulting &amp; Inspection Services</div></div>\n      </div>\n      <div class="es-doc-meta"><div>${today}</div></div>\n    </div>\n    <div class="es-info-grid">\n      <div><div class="k">Client</div><div class="v">${escapeHtml(w.clientName)||"(not entered)"}</div></div>\n      <div><div class="k">${w.offerType==="single"?"Address":"Portfolio"}</div><div class="v">${w.offerType==="single"?escapeHtml([w.address,[w.city,w.siteState].filter(Boolean).join(", ")].filter(Boolean).join(", "))||"—":escapeHtml(w.portfolioName)||"Untitled Portfolio"}</div></div>\n      <div><div class="k">Units</div><div class="v">${units.length} unit${units.length!==1?"s":""}</div></div>\n    </div>\n    <h2 class="es-h2">Services Included</h2>\n    ${renderServiceYearMatrixHTML(totals,w)}\n    <h2 class="es-h2">Pricing Summary</h2>\n    <table class="es-table">\n      <thead><tr><th>Line Item</th><th class="num">Amount</th></tr></thead>\n      <tbody>\n        <tr><td>Subtotal</td><td class="num">${fmtMoney(totals.subtotal)}</td></tr>\n        ${totals.discountPct>0?`<tr><td>Volume discount (${totals.activeTier.awardPct}% award of portfolio)</td><td class="num">&minus;${fmtMoney(totals.discountAmt)}</td></tr>`:""}\n        <tr class="es-total-row"><td>Total Estimated Offer</td><td class="num">${fmtMoney(totals.total)}</td></tr>\n      </tbody>\n    </table>\n    ${renderYearByYearBreakdownSectionHTML(totals,w)}\n    ${renderPerformanceTimelineSectionHTML(w,units)}\n    <div class="es-footnote">Pricing generated from ${RATE_CARD_DISPLAY_NAME}. This estimate is valid for 30 days from the date above.</div>\n  </div>`}function lineItemYearBreakdownHTML(li,w){if(li.serviceId==="inspection"){const isPortfolio=w.offerType==="portfolio";const info=inspectionYearRows(li,w.contractTermYears,isPortfolio);if(!info||!info.years.length)return null;const rowsHTML=isPortfolio?info.years.map(y=>`<tr><td>Year ${y.year}</td><td class="num">${fmtMoney(y.amount)}</td></tr>`).join(""):info.years.map(y=>`<tr><td>Year ${y.year} <span style="color:var(--text-muted); font-size:10.5px;">(${y.date})</span></td><td>${y.categories&&y.categories.length?y.categories.map(c=>escapeHtml(c.name)+(c.billingNote?` <span style="color:var(--text-muted); font-size:10px;">(${c.billingNote})</span>`:"")).join(", "):'<span style="color:var(--text-muted);">none</span>'}${y.missingPriceCategoryIds&&y.missingPriceCategoryIds.length?` <span style="color:var(--amber);">+${y.missingPriceCategoryIds.length} missing price</span>`:""}</td><td class="num">${fmtMoney(y.amount)}</td></tr>`).join("");const colspan=isPortfolio?1:2;return`<table class="es-table">\n      <thead><tr>${isPortfolio?'<th>Contract Year</th><th class="num">Amount</th>':'<th>Contract Year</th><th>Categories Billed</th><th class="num">Amount</th>'}</tr></thead>\n      <tbody>\n        ${rowsHTML}\n        <tr class="es-total-row"><td colspan="${colspan}">Full contract (${info.years.length}yr)</td><td class="num">${fmtMoney(info.contractTotal)}</td></tr>\n      </tbody>\n    </table>\n    ${nonAnnualCaveatHTML(info.nonAnnualCategories,{tableClass:"es-table",wrapCard:false,isPortfolio:isPortfolio})}`}if(li.svc.pricingModel==="verify_tiered"||li.svc.pricingModel==="unit_tiered"||li.serviceId==="general_consulting"){const bo=li.detail&&li.detail.yearBreakout;if(bo&&Array.isArray(bo.pctByYear)&&bo.pctByYear.length){const rowsHTML=bo.pctByYear.map((pct,i)=>`<tr><td>Year ${i+1}</td><td class="num">${pct}%</td><td class="num">${fmtMoney(bo.yearlyAmounts[i]||0)}</td></tr>`).join("");return`<table class="es-table">\n        <thead><tr><th>Contract Year</th><th class="num">% Allocated</th><th class="num">Amount</th></tr></thead>\n        <tbody>\n          ${rowsHTML}\n          <tr class="es-total-row"><td colspan="2">Full contract (${bo.pctByYear.length}yr)</td><td class="num">${fmtMoney(bo.contractTotal||0)}</td></tr>\n        </tbody>\n      </table>`}const d=li.detail||{};const n=w.contractTermYears||1;const annual=d.annualTotal!=null?d.annualTotal:li.amount;const contractTotal=d.contractTotal!=null?d.contractTotal:annual*n;return`<table class="es-table">\n      <thead><tr><th>Contract Year</th><th class="num">Amount</th></tr></thead>\n      <tbody>\n        ${Array.from({length:n},(_,i)=>`<tr><td>Year ${i+1}</td><td class="num">${fmtMoney(annual)}</td></tr>`).join("")}\n        <tr class="es-total-row"><td>Full contract (${n}yr)</td><td class="num">${fmtMoney(contractTotal)}</td></tr>\n      </tbody>\n    </table>`}const bo=li.detail&&li.detail.yearBreakout;if(!bo||!Array.isArray(bo.pctByYear)||!bo.pctByYear.length)return null;const rowsHTML=bo.pctByYear.map((pct,i)=>`<tr><td>Year ${i+1}</td><td class="num">${pct}%</td><td class="num">${fmtMoney(bo.yearlyAmounts[i]||0)}</td></tr>`).join("");return`<table class="es-table">\n    <thead><tr><th>Contract Year</th><th class="num">% Allocated</th><th class="num">Amount</th></tr></thead>\n    <tbody>\n      ${rowsHTML}\n      <tr class="es-total-row"><td colspan y?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitAddJurisdiction()" ${m.busy?"disabled":""}>${m.busy?"Creating…":"Create jurisdiction"}</button>\n      </div>\n    </div>\n  </div>`}const GOV_FREQUENCIES=["6 months","Annual","2 years","3 years","5 years"];function renderVerifyRateCardLive(bands,termCurve,portfolioTiers,contractorRule){const regional=bands.filter(b=>b.table_name==="Regional");return`\n  <div class="card" style="margin-bottom:16px;">\n    <div class="card-header"><p class="card-title">Single Property — Unit-Tier Bands</p></div>\n    <div class="card-pad" style="padding-top:0;">\n      <p class="row-sub" style="margin:10px 0 12px 0;">Regional bands apply up to 100 units. Each band's base $/unit rate is scaled by the contract-term curve below. Above 100 units, a single property is priced using Portfolio / Key Account rates instead (see below) — there is no separate national rate for single properties.</p>\n      <table class="data-table rc-table" style="max-width:360px;"><thead><tr><th>Units</th><th class="num">Base $/unit</th></tr></thead><tbody>\n        ${regional.map(b=>`<tr><td>${b.band_start}–${b.band_end||"+"}</td><td class="num"><span class="rc-cell-currency"><input class="rc-cell-input" type="text" inputmode="numeric" value="${Number(b.base_rate).toLocaleString("en-US")}" oninput="formatCurrencyInput(this)" onchange="updateRateCardCellLive('verify_single_bands','${b.id}','base_rate',currencyInputToNumber(this.value))"></span></td></tr>`).join("")}\n      </tbody></table>\n    </div>\n  </div>\n  <div class="card" style="margin-bottom:16px;">\n    <div class="card-header"><p class="card-title">Portfolio / Key Account — Graduated Device Tiers</p></div>\n    <div class="card-pad" style="padding-top:0;">\n      <p class="row-sub" style="margin:10px 0 12px 0;">Applied to TOTAL portfolio device count (not per-site), billed monthly and annualized. Also applies to any single property once it exceeds 100 units.</p ;return{name:name,count:rows.length,value:rows.reduce((a,o)=>a+o.total,0)}}).sort((a,b)=>b.value-a.value);const portfolioCount=OFFERS.filter(o=>o.type==="portfolio").length;const singleCount=OFFERS.filter(o=>o.type==="single").length;const maxStatusVal=Math.max(...Object.values(byStatus).map(rows=>rows.reduce((a,o)=>a+o.total,0)),1);return`\n  <div class="page-topline">PULSE Pricing</div>\n  <div class="page-header-row">\n    <div>\n      <h1 class="page-title">Pricing Analytics</h1>\n      <p class="page-sub">Admin rollup across ${OFFERS.length} offers · internal tool, not client-facing</p>\n    </div>\n  </div>\n\n  <div class="stat-row">\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Total pipeline value</span><span class="icon-chip">$</span></div>\n      <div class="value">${fmtMoney(totalValue)}</div>\n      <div class="caption">across ${OFFERS.length} offers</div>\n    </div>\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Accepted value</span><span class="icon-chip">${icon("check")}</span></div>\n      <div class="value">${fmtMoney(acceptedValue)}</div>\n      <div class="caption">${byStatus.accepted.length} accepted offer${byStatus.accepted.length!==1?"s":""}</div>\n    </div>\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Win rate</span><span class="icon-chip">%</span></div>\n      <div class="value">${winRate}%</div>\n      <div class="caption">accepted vs. resolved (accepted + expired)</div>\n    </div>\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Portfolio vs. single</span><span class="icon-chip">${icon("clients")}</span></div>\n      <div class="value">${portfolioCount} / ${singleCount}</div>\n      <div class="caption">portfolio offers vs. single-property</div>\n    </div>\n  </div>\n\n  <div class="two-col">\n    <div class="card card-pad">\n      <p class="card-title" style="margin-bottom:14px;">Pipeline value by status</p>\n      <div style="display:flex; flex-direction:column; gap:12px;">\n        ${["draft","sent","accepted","expired"].map(s=>{const rows=byStatus[s];const val=rows.reduce((a,o)=>a+o.total,0);const pct=Math.round(100*val/maxStatusVal);return`<div>\n            <div class="kv-row" style="margin-bottom:5px;"><span class="k">${statusPill(s)} <span style="margin-left:6px;">${rows.length} offer${rows.length!==1?"s":""}</span></span><span class="v">${fmtMoney(val)}</span></div>\n            <div style="background:var(--gray-100); border-radius:6px; height:8px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:var(--blue);"></div></div>\n          </div>`}).join("")}\n      </div>\n    </div>\n    <div class="card card-pad">\n      <p class="card-title" style="margin-bottom:12px;">By pricing administrator</p>\n      <div class="kv-list">\n        ${byOwner.map(o=>`<div class="kv-row"><span class="k">${escapeHtml(o.name)} <span style="color:var(--text-muted);">(${o.count})</span></span><span class="v">${fmtMoney(o.value)}</span></div>`).join("")}\n      </div>\n    </div>\n  </div>`}const REQUIRED_PERSONNEL_HEADERS=["Legal First Name","Legal Last Name","Legal / Preferred Address: City","Legal / Preferred Address: State / Territory Code","Home Department Description","Job Function Description"];const FIELD_JOB_FUNCTIONS={consultant:"Consultant",inspector:"Field Examiner"};let stagedPersonnelRows=null;async function loadImportHistory(){try{const res=await workerFetch("/api/admin/personnel/import-history");const data=await res.json();state.importHistory=res.ok?data:{error:true}}catch(e){state.importHistory={error:true}}render()}function setImportType(type){state.importType=type;stagedPersonnelRows=null;state.importReview=null;state.importResult=null;render()}function parsePersonnelFile(file){return new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=e=>{try{const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:"array",cellDates e-title">Personnel Roster</h1>\n  <p class="page-sub" style="margin-bottom:16px;">Import and refresh the consultant/inspector roster used for "closest to job site" matching.</p>\n\n  <div class="notional-banner">\n    <span class="ic">${icon("warn")}</span>\n    <span>Privacy rule: uploading a sheet here does not expose any name outside this admin screen. The public-facing "closest consultant/inspector" feature only ever returns an anonymous code + distance to non-admin sessions.</span>\n  </div>\n\n  <div class="card">\n    <div class="card-header"><h2 class="card-title">Last import</h2></div>\n    <div class="card-pad">\n      ${!hist?'<div style="color:var(--text-muted); font-size:12px;">Loading…</div>':hist.error?'<div style="color:var(--text-muted); font-size:12px;">Could not load import history.</div>':!hist.length?'<div style="color:var(--text-muted); font-size:12px;">No imports yet.</div>':`<div class="table-scroll"><table class="data-table">\n            <thead><tr><th>When</th><th>Type</th><th>By</th><th>Imported</th><th>Geocode failures</th><th>Excluded</th></tr></thead>\n            <tbody>\n              ${hist.map(e=>`<tr>\n                <td>${escapeHtml(e.created_at)}</td>\n                <td style="text-transform:capitalize;">${escapeHtml(e.import_type)}</td>\n                <td>${escapeHtml(e.actor_name||"—")}</td>\n                <td>${e.imported_count} / ${e.total_rows}</td>\n                <td>${e.geocode_failures}</td>\n                <td>${e.skipped_non_field}</td>\n              </tr>`).join("")}\n            </tbody>\n          </table></div>`}\n    </div>\n  </div>\n\n  <div class="card">\n    <div class="card-header"><h2 class="card-title">Import a roster sheet</h2></div>\n    <div class="card-pad">\n      <div class="helper-banner">\n        <span class="ic">${icon("info")}</span>\n        <span>Upload the original .xlsx export — same file used for PULSE-Mod imports. This screen parses it in your browser (nothing is uploaded until you review and confirm).</span>\n      </div>\n      <div style="display:flex; gap:10px; margin-bottom:14px;">\n        <button class="btn ${state.importType==="consultant"?"btn-primary":""}" onclick="setImportType('consultant')">Consultants</button>\n        <button class="btn ${state.importType==="inspector"?"btn-primary":""}" onclick="setImportType('inspector')">Inspectors</button>\n      </div>\n      <div class="file-drop">\n        <div>Choose the <b>${state.importType==="consultant"?"Consultants":"Inspectors"}</b>.xlsx file</div>\n        <input type="file" accept=".xlsx" onchange="handlePersonnelFile(this)">\n      </div>\n    </div>\n  </div>\n\n  ${review?`\n  <div class="card">\n    <div class="card-header">\n      <h2 class="card-title">Review before importing</h2>\n      <button class="btn btn-primary" ${state.importSubmitting?"disabled":""} onclick="confirmPersonnelImport()">${state.importSubmitting?"Importing…":"Confirm & Import"}</button>\n    </div>\n    <div class="card-pad">\n      <div class="stat-row">\n        <div class="stat-tile"><div class="label">Total rows</div><div class="value">${review.total}</div></div>\n        <div class="stat-tile"><div class="label">Field-eligible</div><div class="value good">${review.totalField}</div></div>\n        <div class="stat-tile"><div class="label">Excluded (non-field role)</div><div class="value">${review.totalNonField}</div></div>\n      </div>\n      <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:10px;">Showing the first 20 rows. Full file will be sent on confirm.</div>\n      <div class="table-scroll">\n        <table class="data-table">\n          <thead><tr><th>Name</th><th>City</th><th>State</th><th>Dept / Vendor</th><th>Job function</th><th>Field role?</th></tr></thead>\n          <tbody>\n            ${review.rows.map(row=>{const isField=row["Job Function Description"]===review.fieldFn;return`<tr>\n                <td>${escapeHtml(row["Legal First Name"])} ${escapeHtml(row[" \n      <button class="btn btn-primary" onclick="openCreateUser()">+ Create User</button>\n    </div>\n    <div class="card-pad">\n      ${!data?'<div style="color:var(--text-muted); font-size:12px;">Loading…</div>':data.error?'<div style="color:var(--text-muted); font-size:12px;">Could not load users. <button class="btn btn-sm" onclick="loadUsers()">Retry</button></div>':!users.length?'<div style="color:var(--text-muted); font-size:12px;">No users yet.</div>':`<div class="table-scroll"><table class="data-table">\n            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead>\n            <tbody>\n              ${users.map(u=>{const isSelf=currentUser&&u.id===currentUser.id;return`<tr>\n                  <td>${escapeHtml(u.name)}${isSelf?'<span class="you-badge">(you)</span>':""} ${u.hubManaged?'<span class="badge-internal" title="Role and sign-in are managed in the PULSE Hub">Managed in Hub</span>':'<span style="color:var(--text-muted); font-size:10.5px;" title="Local account, not linked to a Hub user">Local account</span>'}</td>\n                  <td>${escapeHtml(u.email)||'<span style="color:var(--text-muted);">—</span>'}</td>\n                  <td>\n                    <select ${isSelf?'disabled title="You cannot change your own role here"':u.hubManaged?'disabled title="This role is managed in the Hub. Change it there."':""} data-prev="${u.role}" onchange="changeUserRole('${u.id}', this.value, this)" style="font-size:11.5px; padding:4px 6px; border-radius:6px; border:1px solid var(--border-strong);">\n                      <option value="admin" ${u.role==="admin"?"selected":""}>Admin</option>\n                      <option value="price_editor" ${u.role==="price_editor"?"selected":""}>Pricing Manager</option>\n                      <option value="sales" ${u.role==="sales"?"selected":""}>Sales</option>\n                      ${!KNOWN_ROLES.includes(u.role)?`<option value="${escapeHtml(u.role)}" selected>${escapeHtml(roleLabel(u.role))} (legacy)</option>`:""}\n                    </select>\n                  </td>\n                  <td><span class="status-pill ${u.active?"ok":"failed"}">${u.active?"Active":"Disabled"}</span></td>\n                  <td style="color:var(--text-muted); font-size:11.5px;">${u.last_login_at?new Date(u.last_login_at).toLocaleString():"Never"}</td>\n                  <td>\n                    <div class="row-actions">\n                      <button class="btn btn-sm" onclick="openEditUser('${u.id}', ${escapeHtml(JSON.stringify(u.name))}, ${escapeHtml(JSON.stringify(u.email||""))})">Edit</button>\n                      <button class="btn btn-sm" onclick="openResetPin('${u.id}', ${escapeHtml(JSON.stringify(u.name))})">Reset PIN</button>\n                      <button class="btn btn-sm" title="User lost or never received their PIN email" onclick="resendPin('${u.id}', ${escapeHtml(JSON.stringify(u.name))})">Resend PIN</button>\n                      <button class="btn btn-sm" ${isSelf?'disabled title="You cannot deactivate your own account"':""} onclick="toggleUserActive('${u.id}', ${u.active?"false":"true"})">${u.active?"Deactivate":"Activate"}</button>\n                      <button class="btn btn-sm btn-danger" ${isSelf?'disabled title="You cannot delete your own account"':""} onclick="openDeleteUser('${u.id}', ${escapeHtml(JSON.stringify(u.name))})">Delete</button>\n                    </div>\n                  </td>\n                </tr>`}).join("")}\n            </tbody>\n          </table></div>`}\n    </div>\n  </div>\n\n  ${state.showCreateUser?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeCreateUser()">\n    <div class="modal narrow">\n      <div class="modal-title">Create a new user</div>\n      <div class="field"><label>Name</label><input type="text" id="newUserName" placeholder="First and last name"></div>\n      <div class="field"><label>Email</label><input type="email" id="newUserEmail" placeholder="name@vda.com"></div>\n      <div class="field"><label>Role</label>\n        <select id="newUserRole">\n          <option value="sales">Sales</option>\n          <option value="price_editor">Pricing Manager</option>\n          <option value="admin">Admin</option>\n        </select>\n      </div>\n      <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:12px;">A one-time PIN will be emailed to them. They'll be asked to set their own permanent PIN the first time they sign in. People managed in the PULSE Hub appear here automatically the first time they open Pricing; this form is for local backup accounts.</div>\n      ${state.createUserError?`<div class="form-error">${escapeHtml(state.createUserError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeCreateUser()">Cancel</button>\n        <button class="btn btn-primary" onclick="submitCreateUser()">Create User &amp; Email PIN</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showEditUser?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeEditUser()">\n    <div class="modal narrow">\n      <div class="modal-title">Edit user</div>\n      <div class="field"><label>Name</label><input type="text" id="editUserName" value="${escapeHtml(state.editUserName)}" placeholder="First and last name"></div>\n      <div class="field"><label>Email</label><input type="email" id="editUserEmail" value="${escapeHtml(state.editUserEmail)}" placeholder="name@vda.com"></div>\n      ${state.editUserError?`<div class="form-error">${escapeHtml(state.editUserError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeEditUser()" ${state.editUserBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitEditUser()" ${state.editUserBusy?"disabled":""}>${state.editUserBusy?"Saving…":"Save Changes"}</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showResetPin?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeResetPin()">\n    <div class="modal narrow">\n      <div class="modal-title">Reset PIN for ${escapeHtml(state.resetPinName)}</div>\n      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:12px;">A new one-time PIN will be generated and emailed to them. This immediately signs them out everywhere, and they'll be asked to set their own permanent PIN the next time they sign in.</div>\n      ${state.resetPinError?`<div class="form-error">${escapeHtml(state.resetPinError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeResetPin()" ${state.resetPinBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitResetPin()" ${state.resetPinBusy?"disabled":""}>${state.resetPinBusy?"Sending…":"Send New PIN"}</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.fallbackPinNotice?`\n  <div class="modal-backdrop">\n    <div class="modal narrow">\n      <div class="modal-title">Couldn't email this PIN</div>\n      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">${escapeHtml(state.fallbackPinNotice.reason)||"The email failed to send."} Relay this PIN to <strong>${escapeHtml(state.fallbackPinNotice.name)}</strong> yourself — they'll be asked to set their own permanent PIN when they sign in with it.</div>\n      <div class="field-group" style="text-align:center; margin-bottom:14px;">\n        <div style="font-size:24px; font-weight:600; letter-spacing:3px; padding:10px; background:var(--bg-subtle,#f6f6f7); border-radius:8px;">${escapeHtml(state.fallbackPinNotice.pin)}</div>\n      </div>\n      <div class="modal-footer">\n        <button class="btn btn-primary" onclick="closeFallbackPinNotice()">Done</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showDeleteUser?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeDeleteUser()">\n    <div class="modal narrow">\n      <div class="modal-title"><span style="color:var(--red);">${icon("warn")}</span>Delete ${escapeHtml(state.deleteUserName)}</div>\n      ${state.deleteUserOfferCount?`\n        <div class="modal-desc">${escapeHtml(state.deleteUserName)} owns ${state.deleteUserOfferCount} offer${state.deleteUserOfferCount!==1?"s":""}. Pick an active admin to reassign ${state.deleteUserOfferCount!==1?"them":"it"} to before this account can be deleted.</div>\n        <div class="field">\n          <label>Reassign offers to</label>\n          <select id="deleteUserReassignTo">\n            <option value="">Select an admin…</option>\n            ${(state.usersData||[]).filter(u=>u.role==="admin"&&u.active&&u.id!==deleteUserTargetId).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join("")}\n          </select>\n        </div>\n      `:`<div class="modal-desc">This permanently deletes ${escapeHtml(state.deleteUserName)}'s account and signs them out everywhere. This cannot be undone.</div>`}\n      ${state.deleteUserError?`<div class="form-error">${escapeHtml(state.deleteUserError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeDeleteUser()" ${state.deleteUserBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-danger" onclick="submitDeleteUser()" ${state.deleteUserBusy?"disabled":""}>${state.deleteUserBusy?"Deleting…":"Delete User"}</button>\n      </div>\n    </div>\n  </div>`:""}`}function renderPlaceholder(title){return`\n  <div class="page-topline">PULSE Pricing</div>\n  <h1 class="page-title">${title}</h1>\n  <div class="empty-state card" style="margin-top:20px;">\n    <div class="ic">⚙</div>\n    This view is being built in the next pass.\n  </div>`}function render(){activeCurrencyContext={symbol:"$",rateToUsd:1,mode:"local"};const prevActive=document.activeElement;const prevActiveId=prevActive&&prevActive.id?prevActive.id:null;let prevSelStart=null,prevSelEnd=null;if(prevActiveId){try{prevSelStart=prevActive.selectionStart;prevSelEnd=prevActive.selectionEnd}catch(e){}}const isAdmin=currentUser&&currentUser.role==="admin";let body="";if(state.view==="offers")body=renderOffersRoster();else if(state.view==="wizard")body=renderWizard();else if(state.view==="offer-detail")body=renderOfferDetail();else if(state.view==="ratecard"&&canEditPrices())body=renderRateCards();else if(state.view==="clients")body=renderClientsSites();else if(state.view==="admin"&&isAdmin)body=renderAdmin();else if(state.view==="personnel"&&isAdmin)body=renderPersonnelRoster();else if(state.view==="users"&&isAdmin)body=renderManageUsers();else if(["ratecard","admin","personnel","users"].includes(state.view))body=renderPlaceholder("Not available");else body=renderPlaceholder(state.view);document.getElementById("root").innerHTML=`\n    <div class="app-shell">\n      ${renderSidebar()}\n      <div class="main">${body}</div>\n    </div>\n    ${state.toast?`<div class="toast-wrap"><div class="toast ${state.toast.isError?"error":""}">${escapeHtml(state.toast.msg)}</div></div>`:""}\n    ${renderHelpButton()}\n    ${state.helpOpen?renderHelpDrawer():""}\n    ${state.showSignOut?renderSignOutModal():""}\n  `;if(prevActiveId){const restored=document.getElementById(prevActiveId);if(restored&&typeof restored.focus==="function"){restored.focus();if(prevSelStart!=null&&prevSelEnd!=null&&typeof restored.setSelectionRange==="function"){try{restored.setSelectionRange(prevSelStart,prevSelEnd)}catch(e){}}}}}window.addEventListener("load",async()=>{if(!getHubToken()){if(!await getHubTokenFromOtherTabs(700)){goToHubLogin();return}}const sso=await tryHubSso();if(sso.result==="ok")return;if(sso.result==="signed_out"){authLost();return}if(sso.result==="no_access"){showEntryMessage(sso.message,false);return}if(tryRestoreSession())return;showEntryMessage("PULSE Pricing can't be reached right now. Check your connection and try again.",true)});</script>
