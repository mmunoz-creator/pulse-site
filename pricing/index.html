tElementById("loginPinEyeIcon");const showing=input.type==="text";input.type=showing?"password":"text";btn.setAttribute("aria-label",showing?"Show PIN":"Hide PIN");btn.setAttribute("title",showing?"Show PIN":"Hide PIN");icon.innerHTML=showing?'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>':'<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'}let pendingResetToken=null;async function doLogin(){const name=document.getElementById("loginName").value.trim();const pin=document.getElementById("loginPin").value.trim();setLoginError(null);if(!name||!pin){setLoginError("Enter your name and PIN to continue.");return}const btn=document.getElementById("loginBtn");btn.disabled=true;try{const res=await fetch(WORKER_URL+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,pin:pin})});const data=await res.json();if(!res.ok){setLoginError(data.error||"Sign in failed. Try again.");return}if(data.mustResetPin){pendingResetToken=data.resetToken;document.getElementById("reset-pin-welcome").textContent=`Hi ${data.user.name} — you signed in with a one-time PIN. Choose your own permanent one now.`;document.getElementById("login-screen").classList.add("hidden");document.getElementById("reset-pin-screen").classList.remove("hidden");return}if(!data.token){setLoginError(data.error||"Sign in failed. Try again.");return}if(!["admin","sales"].includes(data.user.role)){setLoginError("This account is not set up for PULSE Pricing. Contact your admin.");return}sessionToken=data.token;currentUser=data.user;ssoActive=false;saveSessionToStorage();document.getElementById("login-screen").classList.add("hidden");document.getElementById("root").classList.remove("hidden");goTo("offers")}catch(e){setLoginError("Could not r ltants",segment:"vt",category:"advisory",desc:"Site visits (Progress Check, Punchlist, Final Review) plus meeting participation. Priced as individual task lines."}];const SERVICE_SEGMENTS=[{id:"vt",name:"Vertical Transportation",adminOnly:false,categories:[{id:"compliance",name:"Compliance"},{id:"evaluations",name:"Evaluations"},{id:"advisory",name:"Advisory"}]},{id:"fire_life",name:"Fire and Life",adminOnly:true,categories:[]}];const YEAR_BREAKOUT_CATEGORY={comp_eval:"uncapped",qce:"uncapped",general_consulting:"uncapped",due_diligence:"capped",project_management:"capped",modernization:"capped",construction:"capped"};const TASK_LINE_CATALOG=["Modernization Survey","Technical Specification","RFP / Bid Process","Contract Award","Submittal Drawing Review","Document Preparation","Shop Drawing Review","Preliminary Evaluation","First Phase Start","25% Construction","50% Construction","75% Construction","Final Phase Complete","Progress Check Site Visit","Punch List Site Visit","Final Review Site Visit","Inspections Complete (AHJ)","Owner Acceptance","Closeout Documentation","Meeting Participation","PM Services","Bidding","Other"];const BILLING_SPLITS=["100% on completion","50% start / 50% completion"];const TRIGGER_TYPES=["Milestone Linked","Recurring/count-based","Flat recurring"];const PERFORMANCE_TIMELINE_SERVICES=["comp_eval","qce","due_diligence","inspection"];const PERFORMANCE_TIMELINE_BANDS={comp_eval:[{maxUnits:10,days:10},{maxUnits:50,days:20},{maxUnits:150,days:35},{maxUnits:Infinity,days:60}],qce:[{maxUnits:10,days:10},{maxUnits:50,days:20},{maxUnits:150,days:35},{maxUnits:Infinity,days:60}],due_diligence:[{maxUnits:10,days:7},{maxUnits:50,days:14},{maxUnits:150,days:25},{maxUnits:Infinity,days:45}],inspection:[{maxUnits:10,days:14},{maxUnits:50,days:30},{maxUnits:150,days:50},{maxUnits:Infinity,days:75}]};function performanceTimelineDaysFor(serviceId,unitCount){const bands=PERFORMANCE_TIMELINE_BANDS[serviceId];if(!bands)return null;const band=bands.find(b=>unitCount<=b.maxUnits)||bands[bands.length-1];return band.days}function performanceTimelineBandLabel(band,idx,bands){const prevMax=idx===0?0:bands[idx-1].maxUnits;if(band.maxUnits===Infinity)return`${prevMax+1}+ units`;return prevMax===0?`1–${band.maxUnits} units`:`${prevMax+1}–${band.maxUnits} units`}const EQUIP_TYPES=["Hydraulic","MRL (Machine-Room-Less)","Traction (Geared)","Traction (Gearless)","Escalator","Wheelchair Lift","Other"];const STOPS_BUCKETS=[{key:"2-4",label:"2–4 stops",min:2,max:4},{key:"5-8",label:"5–8 stops",min:5,max:8},{key:"9-15",label:"9–15 stops",min:9,max:15},{key:"16+",label:"16+ stops",min:16,max:999}];function stopsBucketFor(floorsServed){if(!floorsServed)return null;return(STOPS_BUCKETS.find(b=>floorsServed>=b.min&&floorsServed<=b.max)||STOPS_BUCKETS[0]).key}function lookupKey(equip,stopsKey){return equip+"|"+stopsKey}const RATE_CARD_DISPLAY_NAME="VDA Standard Rate Card — 2026";let activeCurrencyContext={symbol:"$",rateToUsd:1,mode:"local"};function setActiveCurrencyContext(w){if(!w||!w.market||w.market==="US"||!state.marketList){activeCurrencyContext={symbol:"$",rateToUsd:1,mode:"local"};return}const m=state.marketList.find(x=>x.id===w.market);activeCurrencyContext=m?{symbol:m.currency_symbol,rateToUsd:m.rate_to_usd||1,mode:w.currencyDisplay||"local"}:{symbol:"$",rateToUsd:1,mode:"local"}}function currencyDisplayAmount(n){if(activeCurrencyContext.mode==="USD")return{value:n*activeCurrencyContext.rateToUsd,symbol:"$"};return{value:n,symbol:activeCurrencyContext.symbol}}function fmtMoney(n){const{value:value,symbol:symbol}=currencyDisplayAmount(n);return symbol+Math.round(value).toLocaleString("en-US")}function fmtMoneyDec(n){const{value:value,symbol:symbol}=currencyDisplayAmount(n);return symbol+value.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}function pricingModelLabel(model){return{verify_tiered:"tiered calculator",per_unit:"per unit",unit_tiered:"unit tier bands",retainer:"retainer",pm_tiered:"tier pick",ta ght:1.4;">${escapeHtml(t.tagline)}</div>\n            <div style="font-size:10px; color:var(--text-muted); margin-top:6px;">${t.includedHours?`${t.includedHours} hrs`:""}${t.includedHours&&t.includedVisits?" · ":""}${t.includedVisits?`${t.includedVisits} visits`:""} included</div>\n          </div>`).join("")}\n        </div>\n        <div class="field-row-2" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">\n          <div class="field-group" style="margin-bottom:0;">\n            <label class="field-label">Extra Hours <span style="color:var(--text-muted); font-weight:500;">(${fmtMoneyDec(result.hourlyRate)}/hr)</span></label>\n            <input id="pm-extra-hours-${svcId}" class="text-input" type="text" inputmode="numeric" value="${extraHours}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onchange="updatePmExtraHours('${svcId}', this.value)">\n          </div>\n          <div class="field-group" style="margin-bottom:0;">\n            <label class="field-label">Extra Site Visits <span style="color:var(--text-muted); font-weight:500;">(${fmtMoney(result.visitRate)}/visit)</span></label>\n            <input id="pm-extra-visits-${svcId}" class="text-input" type="text" inputmode="numeric" value="${extraVisits}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" onchange="updatePmExtraVisits('${svcId}', this.value)">\n          </div>\n        </div>\n        ${extraHours>0||extraVisits>0?`\n        <div class="kv-list" style="margin-top:12px;">\n          ${result.tier?`<div class="kv-row"><span class="k">${escapeHtml(result.tier.tierName)}</span><span class="v">${fmtMoney(result.tier.price)}</span></div>`:""}\n          ${extraHours>0?`<div class="kv-row"><span class="k">Extra hours (${extraHours} × ${fmtMoneyDec(result.hourlyRate)})</span><span class="v">${fmtMoney(result.extraHoursAmount)}</span></div>`:""}\n          ${extraVisits>0?`<div class="kv-row"><span class="k">Extra visits (${extraVisits} × ${fmtMoney(result.visitRate)})</span><span class="v">${fmtMoney(result.extraVisitsAmount)}</span></div>`:""}\n          <div class="kv-row"><span class="k">Total</span><span class="v" style="font-weight:750;">${fmtMoney(result.subtotal)}</span></div>\n        </div>`:""}\n        ${renderYearBreakoutBlock(svcId,result.subtotal)}\n      </div>\n    </div>`}if(svc.pricingModel==="per_ahj_category"){if(w.offerType==="single"){if(!w.confirmedAhjId||!w.confirmedRegion){return`\n        <div class="card card-pad" style="margin-top:14px;">\n          <h3 class="card-title" style="margin-bottom:4px;">${svc.name}</h3>\n          <p style="color:var(--text-muted); font-size:11px; margin:0 0 10px 0;">Inspection pricing needs two confirmations: which Authority Having Jurisdiction covers this site (drives which categories bill), and which rate-sheet region it falls in (drives the price). A single state can contain multiple AHJs and, for a few states, multiple pricing regions.</p>\n          ${renderAhjPicker()}\n          ${renderRegionPicker()}\n        </div>`}const ahj=w.ahjSuggestion&&w.ahjSuggestion.match&&w.ahjSuggestion.match.id===w.confirmedAhjId?w.ahjSuggestion.match:null;return`\n      <div class="card card-pad" style="margin-top:14px;">\n        <h3 class="card-title" style="margin-bottom:4px;">${svc.name}</h3>\n        <div class="helper-banner" style="margin:8px 0 10px 0;"><span class="ic">${icon("check")}</span>AHJ: <strong>${escapeHtml(ahj?ahj.jurisdiction_name:w.confirmedAhjId)}</strong> &middot; Region: <strong>${escapeHtml(w.confirmedRegion)}</strong></div>\n        ${renderInspectionPricingDetail(li,w.contractTermYears)}\n      </div>`}const props=currentProperties();if(!props.length){return`\n      <div class="card card-pad" style="margin-top:14px;">\n        <h3 class="card-title" style="margin-bottom:4px;">${svc.name}</h3>\n        <div class="notional-banner"><span class="ic">${icon("warn")}</span>Upload the portfolio's unit inventory on Step 2 before assigning AHJs — Inspection pricing is per property.</div>\n      </div>`}const includedProps=props.filter(p=>!w.siteExcluded[p.key]);const confirmedCount=includedProps.filter(p=>w.siteAhj[p.key]&&w.siteRegion[p.key]).length;const excludedCount=props.length-includedProps.length;ensureAhjListLoaded();ensureRegionListLoaded();return`\n    <div class="card" style="margin-top:14px;">\n      <div class="card-header">\n        <h3 class="card-title" style="margin:0;">${svc.name}</h3>\n        <span style="font-size:11px; color:${confirmedCount===includedProps.length?"var(--green)":"var(--amber)"}; font-weight:650;">${confirmedCount} of ${includedProps.length} properties confirmed${excludedCount>0?` · ${excludedCount} excluded`:""}</span>\n      </div>\n      <div class="card-pad">\n        <p style="color:var(--text-muted); font-size:11px; margin:0 0 10px 0;">Inspection pricing depends on each property's AHJ (which categories bill) and rate-sheet region (the price) — a portfolio can span multiple of each. Only confirmed properties are included in the price below. Check "Can't inspect" for a property VDA doesn't cover — it's dropped from Inspection pricing but keeps any other services normally.</p>\n        <div style="display:flex; gap:8px; margin-bottom:10px;">\n          <button class="btn btn-sm btn-primary" ${w.siteAssignLoading?"disabled":""} onclick="lookupSiteAssignments()">${w.siteAssignLoading?"Looking up…":"Look up AHJ &amp; region for all properties"}</button>\n          ${Object.keys(w.siteAhjSuggestions).length?`<button class="btn btn-sm" onclick="confirmAllSiteSuggestions()">Confirm all suggested</button>`:""}\n        </div>\n        <div class="table-card">\n          <table class="data-table">\n            <thead><tr><th></th><th>Property</th><th>City, State</th><th class="num">Units</th><th>AHJ</th><th>Region</th><th class="num">Insp./Yr</th><th class="num">Cost/Unit</th><th class="num">Total (Building)</th></tr></thead>\n            <tbody>\n              ${props.map((p,idx)=>renderSiteAssignmentRow(p,idx,li)).join("")}\n            </tbody>\n          </table>\n          <p style="color:var(--text-muted); font-size:10.5px; margin:8px 12px 0 12px;">Inspection prices per unit — every required category billed once per unit per year. Insp./Yr assumes 1 inspection per required category per year, a placeholder until real per-AHJ mandatory counts are loaded. Total (Building) is each property's real year-1 total; these rows sum to the priced Inspection total below exactly.</p>\n        </div>\n        ${confirmedCount>0?renderInspectionPricingDetail(li,w.contractTermYears,true):""}\n      </div>\n    </div>`}const lines=w.taskLines[svcId]||[];return`\n  <div class="card" style="margin-top:14px;">\n    <div class="card-header"><h3 class="card-title">${svc.name}</h3><span style="font-size:11px; color:var(--text-muted);">${fmtMoney(taskLineTotal(svcId))} total</span></div>\n    <div class="card-pad">\n      <p style="color:var(--text-muted); font-size:11px; margin:0 0 10px 0;">Open task-line schedule — mirrors the real VDA Project task-line pattern. Add lines from the catalog or type a custom name.</p>\n      ${lines.length?`\n      <div class="table-card">\n        <table class="data-table">\n          <thead><tr><th>Task / Service</th><th class="num">Amount</th><th>Billing Split</th><th>Trigger Type</th><th></th></tr></thead>\n          <tbody>\n            ${lines.map(l=>`\n              <tr>\n                <td>\n                  <select class="select-input" onchange="updateTaskLine('${svcId}','${l.id}','name',this.value)">\n                    ${TASK_LINE_CATALOG.map(c=>`<option ${l.name===c?"selected":""}>${c}</option>`).join("")}\n                  </select>\n                </td>\n                <td class="num"><input id="taskline-amt-${svcId}-${l.id}" class="text-input" style="text-align:right; width:100px; display:inline-block;" type="text" inputmode="numeric" value="${Number(l.amount||0).toLocaleString("en-US")}" oninput="formatCurrencyInput(this)" onchange="updateTaskLine('${svcId}','${l.id}','amount',currencyInputToNumber(this.value))"></td>\n                <td><select class="select-input" onchange="updateTaskLine('${svcId}','${l.id}','billingSplit',this.value)">${BILLING_SPLITS.map(b=>`<option ${l.billingSplit===b?"selected":""}>${b}</option>`).join("")}</select></td>\n                <td><select class="select-input" onchange="updateTaskLine('${svcId}','${l.id}','trigger',this.value)">${TRIGGER_TYPES.map(t=>`<option ${l.trigger===t?"selected":""}>${t}</option>`).join("")}</select></td>\n                <td><button class="btn btn-sm btn-ghost" onclick="removeTaskLine('${svcId}','${l.id}')">${icon("close")}</button></td>\n              </tr>`).join("")}\n          </tbody>\n        </table>\n      </div>`:`<div class="empty-state" style="padding:22px;"><div class="ic">☷</div>No task lines yet.</div>`}\n      <button class="btn btn-sm" style="margin-top:10px;" onclick="addTaskLine('${svcId}')">+ Add Task Line</button>\n      ${renderYearBreakoutBlock(svcId,taskLineTotal(svcId))}\n    </div>\n  </div>`}function renderTravelCard(totals){const w=state.wizard;const li=(totals.lineItems||[]).find(x=>x.svc&&x.svc.pricingModel==="travel");if(!li)return"";const d=li.detail||{perSite:[],totalCost:0,mileageRate:0,overnightRate:0,avgMph:65,overnightThresholdHours:3};const billed=(d.perSite||[]).filter(s=>s.billed);const notBilled=(d.perSite||[]).length-billed.length;const anyOvernight=billed.some(s=>s.overnightTriggered);return`\n  <div class="card" style="margin-top:14px;">\n    <div class="card-header">\n      <h3 class="card-title" style="margin:0;">Travel</h3>\n      <div style="font-weight:750; font-size:14px;">${fmtMoney(d.totalCost)}</div>\n    </div>\n    <div class="card-pad">\n      <p style="color:var(--text-muted); font-size:11px; margin:0 0 6px 0;">Round-trip mileage from the nearest available consultant, at the rate card's mileage rate (${fmtMoneyDec(d.mileageRate)}/mi), charged only when one-way distance exceeds 50 miles.${notBilled>0?` ${notBilled} propert${notBilled===1?"y falls":"ies fall"} under that threshold and carr${notBilled===1?"ies":"y"} no travel cost.`:""}</p>\n      \n      <p style="color:var(--text-muted); font-size:11px; margin:0 0 10px 0;">Drive time is estimated at ${d.avgMph}mph average from that same one-way distance. One-way drive time ≥ ${d.overnightThresholdHours} hours adds one night at the rate card's overnight rate (${fmtMoney(d.overnightRate)}).</p>\n      ${billed.length?`\n      <div class="table-card">\n        <table class="data-table">\n          <thead><tr><th>Property</th><th>City, State</th><th>Consultant</th><th class="num">One-way</th><th class="num">Drive time</th><th class="num">Round-trip</th><th class="num">Mileage</th><th class="num">Overnight</th><th class="num">Cost</th></tr></thead>\n          <tbody>\n            ${billed.map(s=>`<tr><td>${escapeHtml(s.property||"—")}</td><td>${escapeHtml([s.city,s.state].filter(Boolean).join(", "))||"—"}</td><td>${escapeHtml(s.code||"—")}</td><td class="num">${s.oneWayMiles} mi</td><td class="num" style="${s.overnightTriggered?"color:var(--amber); font-weight:650;":""}">${s.driveTimeHours}h</td><td class="num">${s.roundTripMiles} mi</td><td class="num">${fmtMoney(s.mileageCost)}</td><td class="num">${s.overnightTriggered?fmtMoney(s.overnightCost):"—"}</td><td class="num" style="font-weight:650;">${fmtMoney(s.cost)}</td></tr>`).join("")}\n          </tbody>\n        </table>\n      </div>\n      ${anyOvernight?`<p style="color:var(--amber); font-size:10.5px; margin:8px 0 0 0;">${icon("warn")} One or more properties trigger an overnight stay (one-way drive time ≥ ${d.overnightThresholdHours}h).</p>`:""}\n      `:`<div class="empty-state" style="padding:18px;"><div class="ic">☷</div>No properties currently exceed the 50-mile travel threshold.</div>`}\n    </div>\n  </div>`}function toggleDeliverable(id){const sel=state.wizard.deliverables;const next=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id];setWizard({deliverables:next.length?next:sel})}function renderWizardStep4(){const w=state.wizard;const totals=computeOfferTotals();setActiveCurrencyContext(w);return`\n  <div class="card card-pad">\n    <h2 class="section-title" style="margin-bottom:4px;">What should PULSE generate?</h2>\n    <p style="color:var(--text-muted); font-size:12px; margin:0 0 16px 0;">Check as many as you need — these are two independent deliverables, not an either/or choice. Most offers will want at least the Estimate Sheet, since it's the only one that includes real pricing today.</p>\n    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">\n      <div class="deliverable-choice ${w.deliverables.includes("estimate")?"selected":""}" onclick="toggleDeliverable('estimate')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("estimate")?icon("check"):""}</div><div class="tc-title">Estimate Sheet</div></div>\n        <div class="tc-desc">A pricing-focused commercial summary — services, rate basis, line items, discount applied, total. Client-ready.</div>\n      </div>\n      <div class="deliverable-choice ${w.deliverables.includes("proposal")?"selected":""}" onclick="toggleDeliverable('proposal')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("proposal")?icon("check"):""}</div><div class="tc-title">Narrative Proposal</div></div>\n        <div class="tc-desc">Pricing &amp; commercial sections only (scope of services, commercial model, payment milestones, performance timeline) in an RFI-response style document. Narrative sections like team bios and risk registers are left as fill-in-later.</div>\n      </div>\n      <div class="deliverable-choice ${w.deliverables.includes("travelBackup")?"selected":""}" onclick="toggleDeliverable('travelBackup')">\n        <div class="dc-head"><div class="chk">${w.deliverables.includes("travelBackup")?icon("check"):""}</div><div class="tc-title">Pricing &amp; Travel Backup Detail</div></div>\n        <div class="tc-desc">Internal document — pricing summary plus a per-property Travel Backup Detail table. Sales/Admin editions differ only in whether the nearest consultant shows by code or by name.</div>\n      </div>\n    </div>\n  </div>\n\n  <div style="max-width:840px; margin: 14px auto 0 auto; display:flex; flex-direction:column; gap:20px;">\n    ${w.deliverables.includes("estimate")?`\n    <div>\n      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">\n        <button class="btn btn-sm" onclick="downloadDocumentPDF('estimate-sheet-doc')"><i class="ti ti-download"></i> Download PDF</button>\n      </div>\n      <div id="estimate-sheet-doc">${renderEstimateSheetHTML()}</div>\n    </div>`:""}\n    ${w.deliverables.includes("proposal")?`\n    <div>\n      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">\n        <button class="btn btn-sm" onclick="downloadDocumentPDF('narrative-proposal-doc')"><i class="ti ti-download"></i> Download PDF</button>\n      </div>\n      <div id="narrative-proposal-doc">${renderNarrativeProposalHTML()}</div>\n    </div>`:""}\n    ${w.deliverables.includes("travelBackup")?`\n    <div>\n      <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">\n        <button class="btn btn-sm" onclick="downloadDocumentPDF('travel-backup-doc')"><i class="ti ti-download"></i> Download PDF</button>\n      </div>\n      <div id="travel-backup-doc">${renderTravelBackupDetailHTML()}</div>\n    </div>`:""}\n  </div>\n\n  <div style="display:flex; justify-content:space-between; margin-top:18px;">\n    <button class="btn" onclick="wizardStep(3)">&larr; Back to Services &amp; Pricing</button>\n    <button class="btn btn-primary" ${w.generating?"disabled":""} onclick="confirmGenerateOffer()">${w.generating?"Generating…":"Confirm &amp; Generate Offer"}</button>\n  </div>`}function downloadDocumentPDF(elementId){document.querySelectorAll(".print-target").forEach(el=>el.classList. []).find(r=>r.ahj_id===ahjId&&r.category_id===catId);const isRequired=req=>!!req&&(req.required===1||req.required===true);function govCell(ahj,cat){const req=reqFor(ahj.id,cat.id);const checked=isRequired(req);const selId=`govfreq_${ahj.id}_${cat.id}`;return`\n    <td class="ir-gov-cell">\n      <div class="ir-gov-cell-inner">\n        <label class="ir-gov-chk-wrap">\n          <span class="chk ${checked?"checked":""}" onclick="toggleGovernanceRequirement('${escapeHtml(ahj.id)}','${cat.id}', ${req?req.id:"null"}, ${checked})">${checked?"✓":""}</span>\n        </label>\n        <select class="ir-gov-freq-select" id="${selId}" ${checked?"":"disabled"}\n          onchange="updateGovernanceFrequency(${req?req.id:"null"}, '${escapeHtml(ahj.id)}', '${cat.id}', this.value)">\n          <option value="" disabled ${checked?"":"selected"}>Select…</option>\n          ${GOV_FREQUENCIES.map(f=>`<option value="${f}" ${checked&&req.frequency===f?"selected":""}>${f}</option>`).join("")}\n        </select>\n      </div>\n    </td>`}function govNotesCell(ahj,cats){const allReqs=cats.map(c=>reqFor(ahj.id,c.id)).filter(Boolean);const activeReqs=allReqs.filter(isRequired);const withNote=activeReqs.find(r=>r.notes)||allReqs.find(r=>r.notes);const target=withNote||activeReqs[0]||allReqs[0];if(!target){return`<td class="ir-gov-notes-cell ir-gov-notes-empty">—</td>`}return`<td class="ir-gov-notes-cell"><input class="text-input" type="text" value="${escapeHtml(target.notes||"")}" placeholder="—"\n      onchange="updateRateCardCellLive('ahj_inspection_requirements','${target.id}','notes',this.value)"></td>`}function renderStateRow(ahj,children){const hasChildren=children.length>0;const expanded=state.governanceExpanded.has(ahj.id);return`\n    <tr class="ir-gov-parent-row">\n      <td class="ir-gov-name-cell">\n        <div style="display:flex; align-items:center; gap:6px;">\n          ${hasChildren?`<button class="ir-gov-expand-btn" onclick="toggleGovernanceExpanded('${escapeHtml(ahj.id)}')" th>\n          ${inspectionCategories.map(c=>`<th>${escapeHtml(c.name)}</th>`).join("")}\n          <th class="ir-notes-header">Notes</th>\n        </tr></thead>\n        ${visibleStates.map(s=>renderStateRow(s,childrenOf(s))).join("")}\n      </table>\n      ${visibleStates.length===0?`<div class="empty-state"><div class="ic">☷</div>No jurisdiction matches "${escapeHtml(state.inspectionGovSearch||"")}".</div>`:""}\n    </div>\n  </div>`}async function toggleGovernanceRequirement(ahjId,categoryId,existingReqId,currentlyChecked){if(existingReqId){updateRateCardCellLive("ahj_inspection_requirements",existingReqId,"required",currentlyChecked?0:1);return}const rateCardId=state.rateCardData.rateCard.id;try{const res=await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-requirement`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ahjId:ahjId,categoryId:categoryId,frequency:null,notes:null})});const data=await res.json();if(!res.ok){showToast(data.error||"Could not save that change.",true);return}showToast("Saved. Choose a frequency to finish.");loadRateCardData()}catch(e){showToast("Could not reach the server.",true)}}async function updateGovernanceFrequency(existingReqId,ahjId,categoryId,frequency){if(existingReqId){updateRateCardCellLive("ahj_inspection_requirements",existingReqId,"frequency",frequency);return}const rateCardId=state.rateCardData.rateCard.id;try{const res=await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-requirement`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({ahjId:ahjId,categoryId:categoryId,frequency:frequency,notes:null})});const data=await res.json();if(!res.ok){showToast(data.error||"Could not save that change.",true);return}showToast("Saved.");loadRateCardData()}catch(e){showToast("Could not reach the server.",true)}}async function createInspectionPriceLive(region,categoryId,inputEl){const price=currencyInputToNumber(inputEl.value);const rateCardId=state.rateCardData.rateCard.id;try{const res=await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-price`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({region:region,categoryId:categoryId,price:price,isPlaceholder:false})});const data=await res.json();if(!res.ok){showToast(data.error||"Could not save that price.",true);return}showToast("Saved.");loadRateCardData()}catch(e){showToast("Could not reach the server.",true)}}function slugifyAhjId(name){const slug=String(name||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");return`ahj_${slug}`}function openAddRegion(){state.addRegionError=null;state.addRegionBusy=false;state.addRegionJurisdictionDefault="";state.showAddRegion=true;render()}function closeAddRegion(){state.showAddRegion=false;state.addRegionError=null;render()}function onAddRegionNameInput(value){const jurisdictionInput=document.getElementById("newRegionJurisdictionName");if(jurisdictionInput&&jurisdictionInput.value===(state.addRegionJurisdictionDefault||"")){jurisdictionInput.value=value}state.addRegionJurisdictionDefault=value}async function submitAddRegion(){const region=document.getElementById("newRegionName").value.trim();const makeAhj=document.getElementById("newRegionMakeAhj").checked;const jurisdictionName=document.getElementById("newRegionJurisdictionName").value.trim();if(!region){state.addRegionError="Region name is required.";render();return}if(makeAhj&&!jurisdictionName){state.addRegionError="AHJ jurisdiction name is required when creating a matching AHJ.";render();return}state.addRegionBusy=true;render();const rateCardId=state.rateCardData.rateCard.id;try{const res=await workerFetch(`/api/admin/rate-cards/${rateCardId}/inspection-region`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({region:region})});const data=await res.json();if(!res.ok){state.addRegionBusy=false;state.addRegionError=data.error||"Could not create that region.";render();return}let ahjNote="";if(makeAhj){const ahjId=slugifyAhjId(jurisdictionName);const ahjRes=await workerFetch(`/api/admin/rate-cards/${rateCardId}/authority`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:ahjId,state:jurisdictionName,jurisdictionName:jurisdictionName,isStateLevel:true})});const ahjData=await ahjRes.json();state.addRegionBusy=false;if(!ahjRes.ok){state.showAddRegion=false;state.addRegionError=null;showToast(`Region "${region}" created, but the matching AHJ could not be created: ${ahjData.error||"unknown error"}`,true);loadRateCardData();return}ahjNote=` and AHJ "${jurisdictionName}"`}else{state.addRegionBusy=false}state.showAddRegion=false;state.addRegionError=null;showToast(`Region "${region}"${ahjNote} created.`);loadRateCardData()}catch(e){state.addRegionBusy=false;state.addRegionError="Could not reach the server. Check your connection and try again.";render()}}function openAddAhj(){state.addAhjError=null;state.addAhjBusy=false;state.addAhjStateDefault="";state.showAddAhj=true;render()}function closeAddAhj(){state.showAddAhj=false;state.addAhjError=null;render()}function onAddAhjNameInput(value){const stateInput=document.getElementById("newAhjState");if(stateInput&&stateInput.value===(state.addAhjStateDefault||"")){stateInput.value=value}state.addAhjStateDefault=value}async function submitAddAhj(){const jurisdictionName=document.getElementById("newAhjJurisdictionName").value.trim();const stateVal=document.getElementById("newAhjState").value.trim();const isStateLevel=document.getElementById("newAhjIsStateLevel").checked;if(!jurisdictionName){state.addAhjError="Jurisdiction name is required.";render();return}if(!stateVal){state.addAhjError="State is required.";render();return}state.addAhjBusy=true;render();const rateCardId=state.rateCardData.rateCard.id;const ahjId=slugifyAhjId(jurisdictionName);try{const res=await workerFetch(`/api/admin/rate-cards/${rateCardId}/authority`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:ahjId,state:stateVal,jurisdictionName:jurisdictionName,isStateLevel:isStateLevel})});const data=await res.json();state.addAhjBusy=false;if(!res.ok){state.addAhjError=data.error||"Could not create that AHJ.";render();return}state.showAddAhj=false;state.addAhjError=null;showToast(`AHJ "${jurisdictionName}" created.`);loadRateCardData()}catch(e){state.addAhjBusy=false;state.addAhjError="Could not reach the server. Check your connection and try again.";render()}}function renderVerifyRateCardLive(bands,termCurve,portfolioTiers,contractorRule){const regional=bands.filter(b=>b.table_name==="Regional");return`\n  <div class="card" style="margin-bottom:16px;">\n    <div class="card-header"><p class="card-title">Single Property — Unit-Tier Bands</p></div>\n    <div class="card-pad" style="padding-top:0;">\n      <p class="row-sub" style="margin:10px 0 12px 0;">Regional bands apply up to 100 units. Each band's base $/unit rate is scaled by the contract-term curve below. Above 100 units, a single property is priced using Portfolio / Key Account rates instead (see below) — there is no separate national rate for single properties.</p>\n      <table class="data-table rc-table" style="max-width:360px;"><thead><tr><th>Units</th><th class="num">Base $/unit</th></tr></thead><tbody>\n        ${regional.map(b=>`<tr><td>${b.band_start}–${b.band_end||"+"}</td><td class="num"><span class="rc-cell-currency"><input class="rc-cell-input" type="text" inputmode="numeric" value="${Number(b.base_rate).toLocaleString("en-US")}" oninput="formatCurrencyInput(this)" onchange="updateRateCardCellLive('verify_single_bands','${b.id}','base_rate',currencyInputToNumber(this.value))"></span></td></tr>`).join("")}\n      </tbody></table>\n    </div>\n  </div>\n  <div class="card" style="margin-bottom:16px;">\n    <div class="card-header"><p class="card-title">Portfolio / Key Account — Graduated Device Tiers</p></div>\n    <div class="card-pad" style="padding-top:0;">\n      <p class="row-sub" style="margin:10px 0 12px 0;">Applied to TOTAL portfolio device count (not per-site), billed monthly and annualized. Also applies to any single property once it exceeds 100 units.</p>\n      <table class="data-table rc-table"><thead><tr><th>Devices</th><th class="num">$/unit/mo</th></tr></thead><tbody>\n        ${portfolioTiers.map(t=>`<tr><td>${t.tier_from}–${t.tier_to||"+"}</td><td class="num"><span class="rc-cell-currency"><input class="rc-cell-input" type="text" inputmode="numeric" value="${Number(t.price_per_unit).toLocaleString("en-US",{minimumFractionDigits:t.price_per_unit%1!==0?2:0})}" oninput="formatCurrencyInput(this)" onchange="updateRateCardCellLive('verify_portfolio_tiers','${t.id}','price_per_unit',currencyInputToNumber(this.value))"></span></td></tr>`).join("")}\n      </tbody></table>\n    </div>\n  </div>\n  <div class="card card-pad" style="margin-bottom:16px;">\n    <p class="card-title" style="margin-bottom:8px;">Contract-term discount curve (Single Property)</p>\n    <table class="data-table rc-table"><thead><tr><th>Term (years)</th><th class="num">Rate factor</th></tr></thead><tbody>\n      ${termCurve.map(c=>`<tr><td>${c.term_years==null?"5+":c.term_years}</td>\n        <td class="num"><input class="rc-cell-input" type="number" min="0" max="1" step="0.01" value="${c.rate_factor}" onchange="updateRateCardCellLive('verify_single_term_curve','${c.id}','rate_factor',this.value)"></td>\n      </tr>`).join("")}\n    </tbody></table>\n  </div>\n  <div class="card card-pad">\n    <p class="card-title" style="margin-bottom:8px;">Extra Contractor Calls</p>\n    <p class="row-sub" style="margin:0 0 12px 0;">\n      Every VERIFY offer includes a set number of contractor calls at no extra charge.\n      Beyond that, each additional contractor adds a flat fee per unit -- this fee does\n      NOT scale with the contract-term discount above (e.g. a 5-year, 6-contractor quote\n      is the discounted unit price PLUS 2 extra contractors x lass="card-header"><h3 class="card-title">Markets</h3></div>\n    <div class="card-pad">\n      <p class="row-sub" style="margin-bottom:14px;">Rates for Canada/United Kingdom are entered in that market's own real currency (via the market selector next to the tabs above) — not converted from USD. Rate to USD here is only the exchange rate used to compute the optional USD-equivalent a rep can toggle on for an offer ("Show Pricing In: USD") — it never changes what's actually quoted.</p>\n      <table class="data-table rc-table">\n        <thead><tr><th>Market</th><th>Currency Code</th><th>Symbol</th><th class="num">Rate to USD</th><th>Status</th><th></th></tr></thead>\n        <tbody>\n          ${markets.map(m=>{const editing=state.editingMarketRate===m.id;return`\n            <tr>\n              <td class="row-title">${escapeHtml(m.name)}</td>\n              <td><input class="rc-cell-input" type="text" value="${escapeHtml(m.currency_code)}" onchange="updateRateCardCellLive('markets','${m.id}','currency_code',this.value)" style="width:70px;"></td>\n              <td><input class="rc-cell-input" type="text" value="${escapeHtml(m.currency_symbol)}" onchange="updateRateCardCellLive('markets','${m.id}','currency_symbol',this.value)" style="width:60px;"></td>\n              <td class="num">\n                ${editing?`\n                <div style="display:flex; align-items:center; gap:6px; justify-content:flex-end;">\n                  <input id="market-rate-input-${m.id}" class="rc-cell-input" type="text" inputmode="decimal" value="${m.rate_to_usd}" oninput="this.value=this.value.replace(/[^0-9.]/g,'')" style="width:90px; text-align:right;">\n                  <button class="btn btn-sm btn-primary" onclick="saveMarketRate('${m.id}', document.getElementById('market-rate-input-${m.id}'))">Save</button>\n                  <button class="btn btn-sm btn-ghost" onclick="cancelEditMarketRate()">Cancel</button>\n                </div>`:`\n                <div style="display:flex; align-items:center; gap:10px; justify-content:flex-end;">\n                  <div>\n                    <div style="font-weight:650;">${m.rate_to_usd}</div>\n                    <div style="font-size:10px; color:var(--text-muted); white-space:nowrap;">${m.rate_to_usd_updated_at?`Confirmed ${escapeHtml(m.rate_to_usd_updated_at)}`:"Never confirmed"}</div>\n                  </div>\n                  <button class="btn btn-sm btn-ghost" onclick="startEditMarketRate('${m.id}')">${icon("admin")} Edit</button>\n                </div>`}\n              </td>\n              <td>\n                <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">\n                  <input type="checkbox" ${m.is_placeholder?"":"checked"} onchange="updateRateCardCellLive('markets','${m.id}','is_placeholder',this.checked?0:1)">\n                  <span style="font-size:11px; color:${m.is_placeholder?"var(--amber)":"var(--text-muted)"};">${m.is_placeholder?"Placeholder — needs confirming":"Confirmed"}</span>\n                </label>\n              </td>\n              <td><button class="btn btn-sm btn-ghost" onclick="cloneMarketStructure('${m.id}')" title="Copy every US rate table's row structure into ${escapeHtml(m.name)} (prices zeroed, flagged placeholder) for tables that don't already have rows there">${icon("admin")} Clone US structure</button></td>\n            </tr>`}).join("")}\n        </tbody>\n      </table>\n    </div>\n  </div>`}function renderRateCards(){if(!state.rateCardData){return`<div class="page-topline">PULSE Pricing</div><h1 class="page-title">Rate Cards</h1><div class="empty-state card" style="margin-top:20px;"><div class="ic">⚙</div>Loading…</div>`}if(state.rateCardData.error){return`<div class="page-topline">PULSE Pricing</div><h1 class="page-title">Rate Cards</h1><div class="empty-state card" style="margin-top:20px; color:var(--red);"><div class="ic">${icon("warn")}</div>${escapeHtml(state.rateCardData.error)}</div>`}const{rateCard:rateCard,unit n  ${svc.pricingModel==="unit_tiered"?renderCcmRateCardLive(ccmUnitBands):""}\n  ${svc.pricingModel==="pm_tiered"?renderPmRateCardLive(pmTiers,pmComponentRates):""}\n  ${svc.pricingModel==="retainer"||svc.pricingModel==="task_line"?`\n  <div class="card card-pad">\n    <p class="card-title" style="margin-bottom:8px;">${svc.name} — ${svc.pricingModel==="retainer"?"Recurring retainer":"Open task-line schedule"}</p>\n    <p class="row-sub" style="margin-bottom:0;">\n      ${svc.pricingModel==="retainer"?"This service is priced as a recurring monthly/annual fee set per offer, not from an equipment × stops lookup table. There is no fixed rate card for retainer services — the fee is negotiated per client and entered directly in the offer wizard.":"This service is priced as an open set of task lines (Survey, Spec, RFP, Site Visits, etc.), each amount entered per offer, not from a lookup table. There is no fixed rate card for task-line services — see the suggested task-line catalog in the offer wizard."}\n    </p>\n  </div>`:""}\n  ${svc.pricingModel==="per_ahj_category"?`\n  ${renderInspectionRateCardLive(inspectionPrices,inspectionCategories,rateCardRegions)}\n  ${renderInspectionGovernanceLive(authorities,ahjRequirements,inspectionCategories)}\n  `:""}\n\n  ${svc.id!=="ccm"&&svc.id!=="verify"?`\n  <div class="card card-pad" style="margin-top:16px;">\n    <p class="card-title" style="margin-bottom:8px;">Travel &amp; per-diem assumptions</p>\n    <div class="kv-list">\n      <div class="kv-row"><span class="k">Mileage rate</span><span class="v">$${Number(rateCard.mileage_rate).toFixed(3)}/mile, round trip from nearest staffed office</span></div>\n      <div class="kv-row"><span class="k">Overnight rate</span><span class="v">${fmtMoney(rateCard.overnight_rate)}/night, applied when one-way drive time (estimated at 65mph average) exceeds 3 hours</span></div>\n      \n    </div>\n  </div>`:""}`}\n\n  ${state.showAddRegion?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeAddRegion()">\n    <div class="modal narrow">\n      <div class="modal-title">Add a new pricing region</div>\n      <div class="modal-desc">Registers a new row on the Inspection Rate Card. It starts with no prices set — fill in each category's rate afterward.</div>\n      <div class="field"><label>Region name</label><input type="text" id="newRegionName" placeholder='e.g. "Ohio" or "Texas (Austin AHJ)"' oninput="onAddRegionNameInput(this.value)"></div>\n      <div class="field" style="margin-bottom:8px;">\n        <label style="display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer;">\n          <input type="checkbox" id="newRegionMakeAhj" checked onchange="setState({})" style="width:auto;">\n          Also create a matching AHJ record\n        </label>\n      </div>\n      <div id="newRegionAhjFields" class="field">\n        <label>AHJ jurisdiction name</label>\n        <input type="text" id="newRegionJurisdictionName" placeholder="e.g. Ohio" value="${escapeHtml(state.addRegionJurisdictionDefault||"")}">\n        <div class="field-hint">Pre-filled to match the region name above — edit if the region label isn't a plain jurisdiction name (e.g. "Texas (Austin AHJ)" → "Texas").</div>\n      </div>\n      ${state.addRegionError?`<div class="form-error">${escapeHtml(state.addRegionError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeAddRegion()" ${state.addRegionBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitAddRegion()" ${state.addRegionBusy?"disabled":""}>${state.addRegionBusy?"Creating…":"Create Region"}</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showAddAhj?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeAddAhj()">\n    <div class="modal narrow">\n      <div class="modal-title">Add a new AHJ</div>\n      <div class="modal-desc">Adds a row to Inspection Governance. Use an existing State's name to nest this under that state's expand/collapse group as a sub-jurisdiction; use a brand-new State name to start a new top-level group.</div>\n      <div class="field"><label>Jurisdiction name</label><input type="text" id="newAhjJurisdictionName" placeholder="e.g. Pennsylvania, Reading" oninput="onAddAhjNameInput(this.value)"></div>\n      <div class="field"><label>State</label><input type="text" id="newAhjState" placeholder="e.g. Pennsylvania" value="${escapeHtml(state.addAhjStateDefault||"")}">\n        <div class="field-hint">Match an existing State value exactly to nest under it; a new value creates a new top-level group.</div>\n      </div>\n      <div class="field" style="margin-bottom:8px;">\n        <label style="display:flex; align-items:center; gap:8px; font-weight:600; cursor:pointer;">\n          <input type="checkbox" id="newAhjIsStateLevel" style="width:auto;">\n          This is a state-level AHJ (not a sub-jurisdiction)\n        </label>\n      </div>\n      ${state.addAhjError?`<div class="form-error">${escapeHtml(state.addAhjError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeAddAhj()" ${state.addAhjBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitAddAhj()" ${state.addAhjBusy?"disabled":""}>${state.addAhjBusy?"Creating…":"Create AHJ"}</button>\n      </div>\n    </div>\n  </div>`:""}`}function renderClientsSites(){return`\n  <div class="page-topline">PULSE Pricing</div>\n  <h1 class="page-title">Clients &amp; Sites</h1>\n  <div class="empty-state card" style="margin-top:20px;">\n    <div class="ic">⚙</div>\n    This view is being rewired to the live client/site data — coming next.\n  </div>`}function offerLineItemLabel(li){if(li.service_id==="travel")return"Travel";const svc=SERVICES.find(s=>s.id===li.service_id);return svc?svc.name:li.service_id}async function changeOfferStatus(id,status){try{const res=await workerFetch(`/api/offers/${id}/status`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:status})});if(!res.ok){const data=await res.json().catch(()=>({}));showToast(data.error||"Could not update status.",true);return}showToast(`Status updated to ${offerStatusLabel(status)}.`);loadOfferDetail(id)}catch(e){showToast("Could not reach the server.",true)}}let deleteOfferTargetId=null;function openDeleteOffer(id,client,status){deleteOfferTargetId=id;state.deleteOfferClient=client;state.deleteOfferStatus=status;state.deleteOfferError=null;state.deleteOfferBusy=false;state.showDeleteOffer=true;render()}function closeDeleteOffer(){deleteOfferTargetId=null;state.showDeleteOffer=false;state.deleteOfferError=null;render()}async function submitDeleteOffer(){state.deleteOfferBusy=true;render();try{const res=await workerFetch(`/api/offers/${deleteOfferTargetId}`,{method:"DELETE"});const data=await res.json().catch(()=>({}));state.deleteOfferBusy=false;if(!res.ok){state.deleteOfferError=data.error||"Could not delete this offer.";render();return}const clientName=state.deleteOfferClient;state.showDeleteOffer=false;state.deleteOfferError=null;showToast(`Offer for ${clientName} deleted.`);goTo("offers");loadOffers()}catch(e){state.deleteOfferBusy=false;state.deleteOfferError="Could not reach the server. Check your connection and try again.";render()}}function renderOfferDetail(){const d=state.offerDetail;if(!d)return`<div class="page-topline">PULSE Pricing</div><h1 class="page-title">Offer Detail</h1><div class="empty-state card" style="margin-top:20px;"><div class="ic">⚙</div>Loading…</div>`;if(d.error)return`<div class="page-topline">PULSE Pricing</div><h1 class="page-title">Offer Detail</h1><div class="empty-state card" style="margin-top:20px; color:var(--red);"><div class="ic">${icon("warn")}</div>${escapeHtml(d.error)}</div>`;const o=normalizeOffer(d);const nextStatuses={draft:"sent",sent:"accepted",accepted:null,expired:null};const nextStatus=nextStatuses[o.status];const isAdmin=currentUser&&currentUser.role==="admin";return`\n  <div class="page-topline"><span class="row-link" style="cursor:pointer;" onclick="goTo('offers')">${icon("back")} Offers</span></div>\n  <div class="hero-band" style="margin-top:8px;">\n    <div class="htitle">${escapeHtml(o.client)}</div>\n    <div class="hmeta">\n      <span>${escapeHtml(o.portfolio)||o.id}</span><span>·</span><span>${o.id}</span><span>·</span>\n      <span>${o.type==="portfolio"?"Portfolio":"Single Property"}</span>\n    </div>\n  </div>\n\n  <div class="two-col">\n    <div>\n      <div class="card card-pad" style="margin-bottom:14px;">\n        <p class="card-title" style="margin-bottom:12px;">Offer Summary</p>\n        <div class="kv-list">\n          <div class="kv-row"><span class="k">Status</span><span class="v">${statusPill(o.status)}</span></div>\n          <div class="kv-row"><span class="k">Sites</span><span class="v">${o.siteCount}</span></div>\n          <div class="kv-row"><span class="k">Units</span><span class="v">${o.unitCount}</span></div>\n          <div class="kv-row"><span class="k">Total</span><span class="v">${o.total?fmtMoney(o.total):"— (pricing in progress)"}</span></div>\n          <div class="kv-row"><span class="k">Owner</span><span class="v">${escapeHtml(o.owner)}</span></div>\n          <div class="kv-row"><span class="k">Last updated</span><span class="v">${o.updated}</span></div>\n        </div>\n      </div>\n      <div class="card" style="margin-bottom:14px;">\n        <div class="card-header"><h3 class="card-title">Services &amp; Pricing</h3></div>\n        <div class="table-scroll">\n          <table class="data-table">\n            <thead><tr><th>Service</th><th class="num">Basis</th><th class="num">Amount</th></tr></thead>\n            <tbody>\n              ${(d.lineItems||[]).map(li=>`<tr><td>${offerLineItemLabel(li)}</td><td class="num">${pricingModelLabel(li.pricing_model)}</td><td class="num">${fmtMoney(li.amount)}${li.is_monthly?"/mo":""}${li.is_annual?"/yr":""}</td></tr>`).join(" cannot be undone.</div>\n      ${["sent","accepted"].includes(state.deleteOfferStatus)?`<div class="form-error">This offer is marked <strong>${offerStatusLabel(state.deleteOfferStatus)}</strong>. Deleting it removes any record the client was ever quoted — make sure that's really what you want.</div>`:""}\n      ${state.deleteOfferError?`<div class="form-error">${escapeHtml(state.deleteOfferError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeDeleteOffer()" ${state.deleteOfferBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-danger" onclick="submitDeleteOffer()" ${state.deleteOfferBusy?"disabled":""}>${state.deleteOfferBusy?"Deleting…":"Delete Offer"}</button>\n      </div>\n    </div>\n  </div>`:""}`}function renderAdmin(){const byStatus={};["draft","sent","accepted","expired"].forEach(s=>byStatus[s]=OFFERS.filter(o=>o.status===s));const totalValue=OFFERS.reduce((a,o)=>a+o.total,0);const acceptedValue=byStatus.accepted.reduce((a,o)=>a+o.total,0);const resolvedCount=byStatus.accepted.length+byStatus.expired.length;const winRate=resolvedCount?Math.round(100*byStatus.accepted.length/resolvedCount):0;const owners=[...new Set(OFFERS.map(o=>o.owner))];const byOwner=owners.map(name=>{const rows=OFFERS.filter(o=>o.owner===name);return{name:name,count:rows.length,value:rows.reduce((a,o)=>a+o.total,0)}}).sort((a,b)=>b.value-a.value);const portfolioCount=OFFERS.filter(o=>o.type==="portfolio").length;const singleCount=OFFERS.filter(o=>o.type==="single").length;const maxStatusVal=Math.max(...Object.values(byStatus).map(rows=>rows.reduce((a,o)=>a+o.total,0)),1);return`\n  <div class="page-topline">PULSE Pricing</div>\n  <div class="page-header-row">\n    <div>\n      <h1 class="page-title">Pricing Analytics</h1>\n      <p class="page-sub">Admin rollup across ${OFFERS.length} offers · internal tool, not client-facing</p>\n    </div>\n  </div>\n\n  <div class="stat-row">\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Total pipeline value</span><span class="icon-chip">$</span></div>\n      <div class="value">${fmtMoney(totalValue)}</div>\n      <div class="caption">across ${OFFERS.length} offers</div>\n    </div>\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Accepted value</span><span class="icon-chip">${icon("check")}</span></div>\n      <div class="value">${fmtMoney(acceptedValue)}</div>\n      <div class="caption">${byStatus.accepted.length} accepted offer${byStatus.accepted.length!==1?"s":""}</div>\n    </div>\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Win rate</span><span class="icon-chip">%</span></div>\n      <div class="value">${winRate}%</div>\n      <div class="caption">accepted vs. resolved (accepted + expired)</div>\n    </div>\n    <div class="stat-tile">\n      <div class="top-row"><span class="label">Portfolio vs. single</span><span class="icon-chip">${icon("clients")}</span></div>\n      <div class="value">${portfolioCount} / ${singleCount}</div>\n      <div class="caption">portfolio offers vs. single-property</div>\n    </div>\n  </div>\n\n  <div class="two-col">\n    <div class="card card-pad">\n      <p class="card-title" style="margin-bottom:14px;">Pipeline value by status</p>\n      <div style="display:flex; flex-direction:column; gap:12px;">\n        ${["draft","sent","accepted","expired"].map(s=>{const rows=byStatus[s];const val=rows.reduce((a,o)=>a+o.total,0);const pct=Math.round(100*val/maxStatusVal);return`<div>\n            <div class="kv-row" style="margin-bottom:5px;"><span class="k">${statusPill(s)} <span style="margin-left:6px;">${rows.length} offer${rows.length!==1?"s":""}</span></span><span class="v">${fmtMoney(val)}</span></div>\n            <div style="background:var(--gray-100); border-radius:6px; height:8px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:var(--blue);"></div></div>\n          </div>`}).join("")}\n      </div>\n    </ NCTIONS[state.importType];let totalField=0,totalNonField=0;rows.forEach(row=>{if(row["Job Function Description"]===fieldFn)totalField++;else totalNonField++});state.importReview={rows:rows.slice(0,20),fieldFn:fieldFn,totalField:totalField,totalNonField:totalNonField,total:rows.length};state.importResult=null;render()}catch(err){showToast("Could not read that file — confirm it is a valid .xlsx export",true)}}async function confirmPersonnelImport(){if(!stagedPersonnelRows)return;state.importSubmitting=true;render();try{const res=await workerFetch("/api/admin/personnel/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:state.importType,rows:stagedPersonnelRows})});const data=await res.json();if(!res.ok){showToast(data.error||"Import failed",true);return}state.importResult=data;state.importReview=null;stagedPersonnelRows=null;showToast(`Imported ${data.importedCount} ${state.importType} record(s).`);loadImportHistory()}catch(e){showToast("Import failed — check your connection and try again.",true)}finally{state.importSubmitting=false;render()}}function renderPersonnelRoster(){const hist=state.importHistory;const review=state.importReview;const result=state.importResult;return`\n  <div class="page-topline">PULSE Pricing</div>\n  <h1 class="page-title">Personnel Roster</h1>\n  <p class="page-sub" style="margin-bottom:16px;">Import and refresh the consultant/inspector roster used for "closest to job site" matching.</p>\n\n  <div class="notional-banner">\n    <span class="ic">${icon("warn")}</span>\n    <span>Privacy rule: uploading a sheet here does not expose any name outside this admin screen. The public-facing "closest consultant/inspector" feature only ever returns an anonymous code + distance to non-admin sessions.</span>\n  </div>\n\n  <div class="card">\n    <div class="card-header"><h2 class="card-title">Last import</h2></div>\n    <div class="card-pad">\n      ${!hist?'<div style="color:var(--text-muted); font-size:12px;">   <div class="card-header">\n      <h2 class="card-title">Review before importing</h2>\n      <button class="btn btn-primary" ${state.importSubmitting?"disabled":""} onclick="confirmPersonnelImport()">${state.importSubmitting?"Importing…":"Confirm & Import"}</button>\n    </div>\n    <div class="card-pad">\n      <div class="stat-row">\n        <div class="stat-tile"><div class="label">Total rows</div><div class="value">${review.total}</div></div>\n        <div class="stat-tile"><div class="label">Field-eligible</div><div class="value good">${review.totalField}</div></div>\n        <div class="stat-tile"><div class="label">Excluded (non-field role)</div><div class="value">${review.totalNonField}</div></div>\n      </div>\n      <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:10px;">Showing the first 20 rows. Full file will be sent on confirm.</div>\n      <div class="table-scroll">\n        <table class="data-table">\n          <thead><tr><th>Name</th><th>City</th><th>State</th><th>Dept / Vendor</th><th>Job function</th><th>Field role?</th></tr></thead>\n          <tbody>\n            ${review.rows.map(row=>{const isField=row["Job Function Description"]===review.fieldFn;return`<tr>\n                <td>${escapeHtml(row["Legal First Name"])} ${escapeHtml(row["Legal Last Name"])}</td>\n                <td>${escapeHtml(row["Legal / Preferred Address: City"])}</td>\n                <td>${escapeHtml(row["Legal / Preferred Address: State / Territory Code"])}</td>\n                <td>${escapeHtml(row["Home Department Description"])}</td>\n                <td>${escapeHtml(row["Job Function Description"])}</td>\n                <td>${isField?'<span class="status-pill ok">Field role</span>':'<span class="status-pill non-field">Excluded</span>'}</td>\n              </tr>`}).join("")}\n          </tbody>\n        </table>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${result?`\n  <div class="card">\n    <div class="card-header"><h2 class="card-title">Import result</h2></div>\n    <div class="card-pad">\n      <div class="stat-row">\n        <div class="stat-tile"><div class="label">Imported</div><div class="value good">${result.importedCount}</div></div>\n        <div class="stat-tile"><div class="label">Geocode failures</div><div class="value ${result.geocodeFailures?"warn":""}">${result.geocodeFailures}</div></div>\n        <div class="stat-tile"><div class="label">Excluded (non-field)</div><div class="value">${result.skippedNonField}</div></div>\n      </div>\n      ${result.failedCities&&result.failedCities.length?`\n      <div class="notional-banner" style="margin-top:4px;">\n        <span class="ic">${icon("warn")}</span>\n        <span>${result.failedCities.length} person/people could not be geocoded and are excluded from "closest to job site" results until their city/state is corrected and re-imported:</span>\n      </div>\n      <table class="data-table">\n        <thead><tr><th>Name</th><th>City</th><th>State</th></tr></thead>\n        <tbody>${result.failedCities.map(f=>`<tr><td>${escapeHtml(f.name)}</td><td>${escapeHtml(f.city)}</td><td>${escapeHtml(f.state)}</td></tr>`).join("")}</tbody>\n      </table>`:""}\n    </div>\n  </div>`:""}`}function roleLabel(role){return{admin:"Admin",sales:"Sales"}[role]||role}async function loadUsers(){try{const res=await workerFetch("/api/admin/users");if(!res.ok)throw new Error("load failed");state.usersData=await res.json()}catch(e){state.usersData={error:true}}render()}function openCreateUser(){state.showCreateUser=true;render()}function closeCreateUser(){state.showCreateUser=false;state.createUserError=null;render()}async function submitCreateUser(){const name=document.getElementById("newUserName").value.trim();const email=document.getElementById("newUserEmail").value.trim();const role=document.getElementById("newUserRole").value;if(!name){state.createUserError="Name is required.";render();return}if(!email){state.createUserError="Email is required — the initial PIN i /td>\n                  <td>\n                    <select ${isSelf?'disabled title="You cannot change your own role here"':""} data-prev="${u.role}" onchange="changeUserRole('${u.id}', this.value, this)" style="font-size:11.5px; padding:4px 6px; border-radius:6px; border:1px solid var(--border-strong);">\n                      <option value="admin" ${u.role==="admin"?"selected":""}>Admin</option>\n                      <option value="sales" ${u.role==="sales"?"selected":""}>Sales</option>\n                      ${!["admin","sales"].includes(u.role)?`<option value="${escapeHtml(u.role)}" selected>${escapeHtml(roleLabel(u.role))} (legacy)</option>`:""}\n                    </select>\n                  </td>\n                  <td><span class="status-pill ${u.active?"ok":"failed"}">${u.active?"Active":"Disabled"}</span></td>\n                  <td style="color:var(--text-muted); font-size:11.5px;">${u.last_login_at?new Date(u.last_login_at).toLocaleString():"Never"}</td>\n                  <td>\n                    <div class="row-actions">\n                      <button class="btn btn-sm" onclick="openEditUser('${u.id}', ${escapeHtml(JSON.stringify(u.name))}, ${escapeHtml(JSON.stringify(u.email||""))})">Edit</button>\n                      <button class="btn btn-sm" onclick="openResetPin('${u.id}', ${escapeHtml(JSON.stringify(u.name))})">Reset PIN</button>\n                      <button class="btn btn-sm" title="User lost or never received their PIN email" onclick="resendPin('${u.id}', ${escapeHtml(JSON.stringify(u.name))})">Resend PIN</button>\n                      <button class="btn btn-sm" ${isSelf?'disabled title="You cannot deactivate your own account"':""} onclick="toggleUserActive('${u.id}', ${u.active?"false":"true"})">${u.active?"Deactivate":"Activate"}</button>\n                      <button class="btn btn-sm btn-danger" ${isSelf?'disabled title="You cannot delete your own account"':""} onclick="openDeleteUser('${u.id}', ${escapeHtml(JSON.stringify(u.name))})">Delete</button>\n                    </div>\n                  </td>\n                </tr>`}).join("")}\n            </tbody>\n          </table></div>`}\n    </div>\n  </div>\n\n  ${state.showCreateUser?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeCreateUser()">\n    <div class="modal narrow">\n      <div class="modal-title">Create a new user</div>\n      <div class="field"><label>Name</label><input type="text" id="newUserName" placeholder="First and last name"></div>\n      <div class="field"><label>Email</label><input type="email" id="newUserEmail" placeholder="name@vda.com"></div>\n      <div class="field"><label>Role</label>\n        <select id="newUserRole">\n          <option value="sales">Sales</option>\n          <option value="admin">Admin</option>\n        </select>\n      </div>\n      <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:12px;">A one-time PIN will be emailed to them. They'll be asked to set their own permanent PIN the first time they sign in.</div>\n      ${state.createUserError?`<div class="form-error">${escapeHtml(state.createUserError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeCreateUser()">Cancel</button>\n        <button class="btn btn-primary" onclick="submitCreateUser()">Create User &amp; Email PIN</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showEditUser?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeEditUser()">\n    <div class="modal narrow">\n      <div class="modal-title">Edit user</div>\n      <div class="field"><label>Name</label><input type="text" id="editUserName" value="${escapeHtml(state.editUserName)}" placeholder="First and last name"></div>\n      <div class="field"><label>Email</label><input type="email" id="editUserEmail" value="${escapeHtml(state.editUserEmail)}" placeholder="name@vda.com"></div>\n      ${state.editUserError?`<div class="form-error">${escapeHtml(state.editUserError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeEditUser()" ${state.editUserBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitEditUser()" ${state.editUserBusy?"disabled":""}>${state.editUserBusy?"Saving…":"Save Changes"}</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showResetPin?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeResetPin()">\n    <div class="modal narrow">\n      <div class="modal-title">Reset PIN for ${escapeHtml(state.resetPinName)}</div>\n      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:12px;">A new one-time PIN will be generated and emailed to them. This immediately signs them out everywhere, and they'll be asked to set their own permanent PIN the next time they sign in.</div>\n      ${state.resetPinError?`<div class="form-error">${escapeHtml(state.resetPinError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeResetPin()" ${state.resetPinBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-primary" onclick="submitResetPin()" ${state.resetPinBusy?"disabled":""}>${state.resetPinBusy?"Sending…":"Send New PIN"}</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.fallbackPinNotice?`\n  <div class="modal-backdrop">\n    <div class="modal narrow">\n      <div class="modal-title">Couldn't email this PIN</div>\n      <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:10px;">${escapeHtml(state.fallbackPinNotice.reason)||"The email failed to send."} Relay this PIN to <strong>${escapeHtml(state.fallbackPinNotice.name)}</strong> yourself — they'll be asked to set their own permanent PIN when they sign in with it.</div>\n      <div class="field-group" style="text-align:center; margin-bottom:14px;">\n        <div style="font-size:24px; font-weight:600; letter-spacing:3px; padding:10px; background:var(--bg-subtle,#f6f6f7); border-radius:8px;">${escapeHtml(state.fallbackPinNotice.pin)}</div>\n      </div>\n      <div class="modal-footer">\n        <button class="btn btn-primary" onclick="closeFallbackPinNotice()">Done</button>\n      </div>\n    </div>\n  </div>`:""}\n\n  ${state.showDeleteUser?`\n  <div class="modal-backdrop" onclick="if(event.target===this) closeDeleteUser()">\n    <div class="modal narrow">\n      <div class="modal-title"><span style="color:var(--red);">${icon("warn")}</span>Delete ${escapeHtml(state.deleteUserName)}</div>\n      ${state.deleteUserOfferCount?`\n        <div class="modal-desc">${escapeHtml(state.deleteUserName)} owns ${state.deleteUserOfferCount} offer${state.deleteUserOfferCount!==1?"s":""}. Pick an active admin to reassign ${state.deleteUserOfferCount!==1?"them":"it"} to before this account can be deleted.</div>\n        <div class="field">\n          <label>Reassign offers to</label>\n          <select id="deleteUserReassignTo">\n            <option value="">Select an admin…</option>\n            ${(state.usersData||[]).filter(u=>u.role==="admin"&&u.active&&u.id!==deleteUserTargetId).map(u=>`<option value="${u.id}">${escapeHtml(u.name)}</option>`).join("")}\n          </select>\n        </div>\n      `:`<div class="modal-desc">This permanently deletes ${escapeHtml(state.deleteUserName)}'s account and signs them out everywhere. This cannot be undone.</div>`}\n      ${state.deleteUserError?`<div class="form-error">${escapeHtml(state.deleteUserError)}</div>`:""}\n      <div class="modal-footer">\n        <button class="btn" onclick="closeDeleteUser()" ${state.deleteUserBusy?"disabled":""}>Cancel</button>\n        <button class="btn btn-danger" onclick="submitDeleteUser()" ${state.deleteUserBusy?"disabled":""}>${state.deleteUserBusy?"Deleting…":"Delete User"}</button>\n      </div>\n    </div>\n  </div>`:""}`}function renderPlaceholder(title){return`\n  <div class="page-topline">PULSE Pricing</div>\n  <h1 class="page-title">${title}</h1>\n  <div class="empty-state card" style="margin-top:20px;">\n    <div class="ic">⚙</div>\n    This view is being built in the next pass.\n  </div>`}function render(){activeCurrencyContext={symbol:"$",rateToUsd:1,mode:"local"};const prevActive=document.activeElement;const prevActiveId=prevActive&&prevActive.id?prevActive.id:null;let prevSelStart=null,prevSelEnd=null;if(prevActiveId){try{prevSelStart=prevActive.selectionStart;prevSelEnd=prevActive.selectionEnd}catch(e){}}const isAdmin=currentUser&&currentUser.role==="admin";let body="";if(state.view==="offers")body=renderOffersRoster();else if(state.view==="wizard")body=renderWizard();else if(state.view==="offer-detail")body=renderOfferDetail();else if(state.view==="ratecard"&&isAdmin)body=renderRateCards();else if(state.view==="clients")body=renderClientsSites();else if(state.view==="admin"&&isAdmin)body=renderAdmin();else if(state.view==="personnel"&&isAdmin)body=renderPersonnelRoster();else if(state.view==="users"&&isAdmin)body=renderManageUsers();else if(["ratecard","admin","personnel","users"].includes(state.view))body=renderPlaceholder("Not available");else body=renderPlaceholder(state.view);document.getElementById("root").innerHTML=`\n    <div class="app-shell">\n      ${renderSidebar()}\n      <div class="main">${body}</div>\n    </div>\n    ${state.toast?`<div class="toast-wrap"><div class="toast ${state.toast.isError?"error":""}">${escapeHtml(state.toast.msg)}</div></div>`:""}\n  `;if(prevActiveId){const restored=document.getElementById(prevActiveId);if(restored&&typeof restored.focus==="function"){restored.focus();if(prevSelStart!=null&&prevSelEnd!=null&&typeof restored.setSelectionRange==="function"){try{restored.setSelectionRange(prevSelStart,prevSelEnd)}catch(e){}}}}}window.addEventListener("load",async()=>{const ssoOk=await tryHubSso();const restored=ssoOk?true:tryRestoreSession();if(!ssoOk&&!restored){const antiFlash=document.getElementById("anti-flash-style");if(antiFlash)antiFlash.remove()}});</script>
