#login-screen, #reset-pin-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 20% 100%,#0d2b24 0%,#061020 55%,#04070d 100%);

}
#login-particles{position:absolute; inset:0; z-index:0;}
.login-card-outer{
  position:relative; z-index:1; display:flex; width:100%; max-width:900px; min-height:560px;
  background:white; border-radius:20px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.login-hero{
  flex:0 0 44%; background:linear-gradient(165deg,#08251d 0%,#0d2b24 60%,#061020 100%);
  position:relative; overflow:hidden; padding:44px 38px; display:flex; flex-direction:column;
}
.login-hero-particles{position:absolute; inset:0; z-index:0;}
.login-hero-content{position:relative; z-index:1; display:flex; flex-direction:column; height:100%;}
.login-logo-row{display:flex; align-items:center; gap:10px;}
.login-logo-mark{width:34px; height:34px; flex-shrink:0;}
.login-wordmark{font-size:26px; font-weight:800; color:white; letter-spacing:-0.5px; line-height:1;}
.login-wordmark .accent{color:#2fd9a8;}
.login-hero-tagline{margin-top:auto; padding-top:40px;}
.login-hero-tagline h2{font-size:26px; font-weight:750; color:white; line-height:1.28; margin:0 0 14px; letter-spacing:-0.3px;}
.login-hero-tagline h2 .accent{color:#5eeac3;}
.login-form-side{flex:1; padding:48px 46px; display:flex; flex-direction:column; justify-content:center;}
.login-form-inner{width:100%; max-width:340px; margin:0 auto;}
.login-form-title{font-size:24px; font-weight:800; color:#14181f; margin:0 0 6px; letter-spacing:-0.4px;}
.login-form-sub{font-size:13px; color:#6b7280; margin:0 0 28px;}
.login-field-wrap{margin-bottom:16px;}
.login-field-label{font-size:11.5px; font-weight:700; color:#374151; display:block; margin-bottom:6px;}
input.login-styled{
  width:100%; padding:11px 13px; border:1px solid #e3e6ea; border-radius:9px; background:#fafafa;
  color:#14181f; font-size:13.5px; outline:none; transition:border .15s, background .15s; font-family:inherit;
}
input.login-styled:focus{border-color:#17b98c; box-shadow:0 0 0 3px rgba(23,185,140,.15); background:white;}
.login-btn{
  width:100%; padding:13px; margin-top:6px; background:linear-gradient(135deg,#0e9370,#2fd9a8); color:white;
  border:none; border-radius:9px; font-size:14.5px; font-weight:700; cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:8px; transition:all .2s; box-shadow:0 6px 20px rgba(23,185,140,.35);
  font-family:inherit;
}
.login-btn:hover{background:linear-gradient(135deg,#0c7d5f,#0e9370); box-shadow:0 8px 26px rgba(23,185,140,.45);}
.login-btn:disabled{opacity:.6; cursor:not-allowed;}
#login-error{display:none; color:#c0392b; font-size:12px; margin-top:8px; line-height:1.5;}
.login-footnote{font-size:11.5px; color:#9ca3af; margin-top:26px; text-align:center;}
@media(max-width:760px){.login-hero{display:none;} .login-card-outer{max-width:420px;} .login-form-side{padding:40px 30px;}}

.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 216px; flex-shrink: 0; background: var(--navy);
  display: flex; flex-direction: column;
  padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  font-family: 'Plus Jakarta Sans', var(--font);
}
.sidebar-logo { display:flex; align-items:center; gap:9px; padding: 4px 6px 14px 6px; }
.sidebar-logo .mark {
  width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--mint), var(--mint-dark));
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.sidebar-logo .mark svg { width:16px; height:16px; }
.sidebar-logo .word { color: white; font-weight: 800; font-size: 16px; letter-spacing: 0.2px; }
.sidebar-logo .word .seg { color: var(--mint); }

  display:inline-block; margin: 4px 4px 16px 4px; padding: 2px 8px; font-size: 9.5px; font-weight: 700;

  width: fit-content;
}

.nav-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.6px; color: rgba(255,255,255,0.32);
  padding: 14px 10px 6px 10px; text-transform: uppercase;
}
.nav-section-label:first-of-type { padding-top: 4px; }
.nav-item {
  display:flex; align-items:center; gap:10px; padding: 8px 10px; border-radius: 7px; margin-bottom: 1px;
  color: rgba(255,255,255,0.68); font-size: 12.5px; font-weight: 500; cursor:pointer; transition: background .1s;
}
.nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
.nav-item.active { background: rgba(47,217,168,0.16); color: #a9f5e0; font-weight: 650; }
.nav-item .ic { width:18px; text-align:center; opacity:0.9; flex-shrink:0; font-size:17px; line-height:1; }
.nav-item .badge-count {
  margin-left:auto; background: var(--blue-fill); color:white; font-size:9.5px; font-weight:700;
  border-radius: 100px; padding: 1px 6px; min-width:16px; text-align:center;
}

.sidebar-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-user { display:flex; align-items:center; gap:9px; padding: 6px; }
.sidebar-user .avatar {
  width:30px; height:30px; border-radius:50%; background: var(--mint-dark); color:#06231b; font-weight:700;
  font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.sidebar-user .who { line-height:1.3; }
.sidebar-user .name { color:white; font-size:12px; font-weight:650; }
.sidebar-user .role { color: rgba(255,255,255,0.45); font-size:10.5px; }
.sidebar-signout-btn {
  display:flex; align-items:center; gap:8px; width:100%; padding: 8px 12px; margin-top: 8px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px;
  color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 600; cursor:pointer;
  font-family: inherit; transition: background .12s, border-color .12s, color .12s;
}
.sidebar-signout-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.22); color: white; }
.sidebar-signout-btn i { font-size: 15px; flex-shrink:0; }
.sidebar-version { color: rgba(255,255,255,0.28); font-size: 10px; padding: 6px 6px 0 6px; letter-spacing: 0.3px; }

.theme-toggle { display:flex; align-items:center; gap:6px; padding:3px; border-radius:9px; background: rgba(255,255,255,0.06); margin: 2px 0 8px 0; }
.theme-toggle-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; font-family:inherit; font-size:11px; font-weight:700;
  padding:7px 6px; border-radius:7px; border:none; background:transparent; color: rgba(255,255,255,0.55); cursor:pointer; }
.theme-toggle-btn.active { background: rgba(255,255,255,0.14); color:#fff; }
.theme-toggle-btn svg { opacity:.9; flex-shrink:0; }

.main { flex:1; min-width:0; padding: 22px 30px 60px 30px; }


.page-topline { display:flex; align-items:center; gap:8px; color: var(--text-muted); font-size:11.5px; margin-bottom:4px; }
.page-header-row { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.page-title { font-size: 21px; font-weight: 750; margin: 0 0 3px 0; letter-spacing:-0.2px; }
.page-sub { font-size: 12.5px; color: var(--text-muted); margin:0; }
.page-actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }


.btn {
  display:inline-flex; align-items:center; gap:6px; padding: 8px 14px; font-size: 12px; font-weight: 650;
  border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary);
  transition: all .12s;
}
.btn:hover { background: var(--gray-50); border-color: var(--gray-500); }
.btn-primary { background: var(--blue-fill); border-color: var(--blue-fill); color: white; }
.btn-primary:hover { background: var(--blue-fill-dark); border-color: var(--blue-fill-dark); }
.btn-green { background: var(--green-fill); border-color: var(--green-fill); color: white; }
.btn-green:hover { filter: brightness(0.92); }
.btn-danger { background: var(--surface); border-color: var(--red); color: var(--red); }
.btn-danger:hover { background: var(--red-pale); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--gray-100); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:hover { background: var(--surface); border-color: var(--border-strong); }


.stat-row { display:grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat-row.cols-5 { grid-template-columns: repeat(5, 1fr); }
.stat-row.cols-6 { grid-template-columns: repeat(6, 1fr); }
.stat-tile {
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding: 14px 16px;
  display:flex; flex-direction:column; gap: 4px;
}
.stat-tile .top-row { display:flex; align-items:center; justify-content:space-between; }
.stat-tile .label { font-size:11px; color: var(--text-muted); font-weight:600; }
.stat-tile .icon-chip {
  width:26px; height:26px; border-radius:7px; background: var(--blue-pale); color: var(--blue);
  display:flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;
}
.stat-tile .value { font-size: 22px; font-weight: 750; letter-spacing:-0.3px; }
.stat-tile .caption { font-size: 10.5px; color: var(--text-muted); }
.stat-tile .caption.critical { color: var(--red); font-weight:600; }


.helper-banner {
  display:flex; gap:9px; align-items:flex-start; background: var(--blue-pale); color: var(--blue-dark);
  border: 1px solid var(--blue-border); border-radius: var(--radius-sm); padding: 10px 13px; font-size:12px; margin-bottom:14px;
}
.helper-banner .ic { flex-shrink:0; margin-top:1px; }
.notional-banner {
  display:flex; gap:9px; align-items:flex-start; background: var(--amber-pale); color: var(--amber);
  border: 1px solid var(--amber-border); border-radius: var(--radius-sm); padding: 10px 13px; font-size:12px; margin-bottom:14px;
}
.notional-banner .ic { flex-shrink:0; margin-top:1px; }
.notional-banner b { color: inherit; }
.purple-banner {
  display:flex; gap:9px; align-items:flex-start; background: var(--purple-pale); color: var(--purple);
  border: 1px solid var(--purple-border); border-radius: var(--radius-sm); padding: 10px 13px; font-size:12px; margin-bottom:14px;
}


.filter-tabs { display:flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; flex-wrap:wrap; }
.filter-tab {
  padding: 8px 12px; font-size:12px; font-weight:600; color: var(--text-muted); border-bottom: 2px solid transparent;
  cursor:pointer; margin-bottom:-1px;
}
.filter-tab:hover { color: var(--text-primary); }
.filter-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.chip-row { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.chip {
  padding: 6px 12px; font-size:11.5px; font-weight:600; border-radius:100px; border:1px solid var(--border-strong);
  background: var(--surface); color: var(--text-secondary); cursor:pointer;
}
.chip.active { background: var(--chip-on-bg); border-color: var(--chip-on-bg); color: var(--chip-on-ink); }
.chip:hover:not(.active) { background: var(--gray-50); }

.legend-row { display:flex; gap:14px; align-items:center; font-size:10.5px; color: var(--text-muted); margin: 0 0 10px 2px; flex-wrap:wrap; }
.legend-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }


.table-card { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; }
.table-scroll { overflow-x:auto; }

.tree-scroll { overflow:auto; max-height:calc(100vh - 150px); min-height:320px; will-change:scroll-position; }
.data-table { font-size:12.5px; }
.data-table thead th {
  text-align:left; font-size:10.5px; font-weight:700; letter-spacing:0.3px; color: var(--text-muted);
  text-transform:uppercase; padding: 10px 14px; border-bottom:1px solid var(--border); white-space:nowrap;
  background: var(--gray-25);
}
.data-table thead th.num, .data-table td.num { text-align:right; }

  display:flex; align-items:center; justify-content:center; font-size:10px; color:white; flex-shrink:0; margin-top:1px; }
.service-row.checked .chk { background: var(--blue-fill); border-color: var(--blue-fill); }
.service-row .srv-name { font-weight:650; font-size:12.5px; }
.service-row .srv-desc { font-size:11px; color: var(--text-muted); margin-top:2px; line-height:1.4; }
.pricing-model-tag { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.3px; color: var(--text-muted);
  background: var(--gray-100); padding:1px 6px; border-radius:4px; margin-left:6px; }

.dropzone { border: 1.5px dashed var(--border-strong); border-radius: var(--radius); padding: 24px; text-align:center; cursor:pointer; transition: all .1s; }
.dropzone:hover { border-color: var(--blue); background: var(--blue-pale); }
.dz-icon { font-size:20px; color: var(--text-muted); margin-bottom:6px; }
.dz-title { font-weight:650; font-size:12.5px; }
.dz-sub { font-size:11px; color: var(--text-muted); margin-top:3px; }

.deliverable-choice { border: 1.5px solid var(--border-strong); border-radius: var(--radius); padding: 16px; cursor:pointer; transition: all .1s; }
.deliverable-choice:hover { border-color: var(--blue); }
.deliverable-choice.selected { border-color: var(--blue); background: var(--blue-pale); box-shadow: 0 0 0 1px var(--blue); }
.deliverable-choice .dc-head { display:flex; align-items:center; gap:9px; margin-bottom:5px; }
.deliverable-choice .chk { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--border-strong); background: var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:10px; color:white; flex-shrink:0; }
.deliverable-choice.selected .chk { background: var(--blue-fill); border-color: var(--blue-fill); }
.deliverable-choice .tc-title { margin-bottom:0; }


.status-pill.ok { background: var(--green-pale); color: var(--green); }
.status-pill.failed { background: var(--red-pale); color: var(--red); }
.status-pill.non-field { background: var(--gray-100); color: var(--text-secondary); }
.stat-tile .value.good { color: var(--green); }
.stat-tile .value.warn { color: var(--amber); }
.toast.success { background: var(--green-fill); }
.file-drop {
  border: 2px dashed var(--border-strong); border-radius: var(--radius); padding: 28px; text-align:center;
  background: var(--gray-25); font-size:13px; color: var(--text-secondary);
}
.file-drop input[type=file] { margin-top: 10px; }
.role-pill.admin { background: var(--purple-pale); color: var(--purple); }
.role-pill.sales { background: var(--blue-pale); color: var(--blue-dark); }
.role-pill.general { background: var(--gray-100); color: var(--text-secondary); }
.you-badge { font-size:10px; font-weight:700; color: var(--text-muted); margin-left:6px; }
.form-error {
  background: var(--red-pale); color: var(--red); border:1px solid var(--red-border); border-radius: var(--radius-sm);
  padding: 9px 12px; font-size:12px; margin-bottom:12px;
}
.row-actions { display:flex; gap:6px; flex-wrap:wrap; }
.row-actions .btn { padding:6px 10px; font-size:11.5px; }
.field { margin-bottom: 12px; }
.field label { display:block; font-size:11.5px; font-weight:650; color: var(--text-secondary); margin-bottom:5px; }
.field input, .field select {
  width:100%; padding: 9px 11px; font-size:13px; border:1px solid var(--border-strong); border-radius: var(--radius-sm);
  font-family: var(--font); background: var(--surface);
}
</style>
</head>

<script>const APP_VERSION="v4k";const WORKER_URL="https://pulse-pricing-api.misty-munoz.workers.dev";let sessionToken=null;let currentUser=null;const KNOWN_ROLES=["admin","price_editor","sales"];let ssoActive=false;let demoMode=null;function isDemo(){return!!demoMode}const SESSION_STORAGE_KEY="pulse_pricing_session";function saveSessionToStorage(){try{sessionStorage.setItem(SESSION_STORAGE_KEY,JSON.stringify({token:sessionToken,user:currentUser,ssoActive:ssoActive}))}catch(e){}}function clearSessionStorage(){try{sessionStorage.removeItem(SESSION_STORAGE_KEY)}catch(e){}}function tryRestoreSession(){let saved=null;try{const raw=sessionStorage.getItem(SESSION_STORAGE_KEY);if(raw)saved=JSON.parse(raw)}catch(e){return false}if(!saved||!saved.token||!saved.user)return false;sessionToken=saved.token;currentUser=saved.user;ssoActive=!!saved.ssoActive;document.getElementById("login-screen").classList.add("hidden");document.getElementById("root").classList.remove("hidden");goTo("offers");startAuthWatch();return true}const HUB_WORKER_URL="https://pulse-hub-api.misty-munoz.workers.dev";function getHubTokenFromOtherTabs(waitMs){return new Promise(function(resolve){let ch=null;try{ch=new BroadcastChannel("pulse-hub-auth")}catch(e){resolve("");return}const reqId=Math.random().toString(36).slice(2)+Date.now().toString(36);const done=function(v){try{ch.close()}catch(e){}resolve(v)};const timer=setTimeout(function(){done("")},waitMs||700);ch.onmessage=function(ev){const m=ev&&ev.data;if(m&&m.type==="token"&&m.reqId===reqId&&typeof m.token==="string"&&m.token){clearTimeout(timer);try{sessionStorage.setItem("pulse_hub_token",m.token);if(m.name)sessionStorage.setItem("pulse_hub_display_name",m.name)}catch(e){}done(m.token)}};ch.postMessage({type:"ask",reqId:reqId})})}(function(){try{const ch=new BroadcastChannel("pulse-hub-auth");ch.onmessage=function(ev){const m=ev&&ev.data;if(!m||m.type!=="ask"||typeof m.reqId!=="string")return;const t=getHubToken();let n="";try{n=sessionStorage.getItem("pulse_hub_display_name")||""}catch(e){}if(t)ch.postMessage({type:"token",reqId:m.reqId,token:t,name:n})}}catch(e){}})();function getHubToken(){try{return sessionStorage.getItem("pulse_hub_token")||""}catch(e){return""}}function clearAllSignInState(){sessionToken=null;currentUser=null;pendingResetToken=null;ssoActive=false;clearSessionStorage();try{sessionStorage.removeItem("pulse_hub_token");sessionStorage.removeItem("pulse_hub_display_name")}catch(e){}}function goToHubLogin(){stopAuthWatch();location.replace("/login/")}function authLost(){const t=getHubToken();if(t){try{fetch(HUB_WORKER_URL+"/logout",{method:"POST",headers:{Authorization:"Bearer "+t},keepalive:true}).catch(function(){})}catch(e){}}clearAllSignInState();goToHubLogin()}let authWatchTimer=null;async function checkHubSession(){const t=getHubToken();if(!sessionToken)return;if(!t){authLost();return}try{const r=await fetch(HUB_WORKER_URL+"/session",{headers:{Authorization:"Bearer "+t}});if(r.status===401)authLost()}catch(e){}}function startAuthWatch(){stopAuthWatch();authWatchTimer=setInterval(checkHubSession,6e4)}function stopAuthWatch(){if(authWatchTimer){clearInterval(authWatchTimer);authWatchTimer=null}}document.addEventListener("visibilitychange",function(){if(!document.hidden)checkHubSession()});document.addEventListener("keydown",function(e){if(e.key==="Escape"&&state.showSignOut)closeSignOut()});function showEntryMessage(message,canRetry){const af=document.getElementById("anti-flash-style");if(af)af.remove();setLoginError(message);document.getElementById("loginRetryBtn").style.display=canRetry?"":"none";document.getElementById("root").classList.add("hidden");document.getElementById("login-screen").classList.remove("hidden")}async function workerFetch(path,opts={}){const o={...opts};o.headers={...o.headers||{}};if(sessionToken)o.headers["Authorization"]="Bearer "+sessionToken;const res=await fetch(WORKER_URL+path,o);if(res.status===401&&path!=="/login"&&path!=="/api/auth/set-pin"){if(isDemo()){demoSessionEnded();return new Promise(function(){})}authLost();return new Promise(function(){})}return res}function setLoginError(message){const el=document.getElementById("login-error");if(message){el.textContent=message;el.style.display="block"}else{el.textContent="";el.style.display="none"}}function toggleVisibility(inputId,btnEl){const input=document.getElementById(inputId);const showing=input.type==="text";input.type=showing?"password":"text";btnEl.setAttribute("aria-label",showing?"Show PIN":"Hide PIN");btnEl.setAttribute("title",showing?"Show PIN":"Hide PIN")}function toggleLoginPinVisibility(){const input=document.getElementById("loginPin");const btn=document.getElementById("loginPinToggle");const icon=document.getElementById("loginPinEyeIcon");const showing=input.type==="text";input.type=showing?"password":"text";btn.setAttribute("aria-label",showing?"Show PIN":"Hide PIN");btn.setAttribute("title",showing?"Show PIN":"Hide PIN");icon.innerHTML=showing?'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>':'<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'}let pendingResetToken=null;async function doLogin(){const name=document.getElementById("loginName").value.trim();const pin=document.getElementById("loginPin").value.trim();setLoginError(null);if(!name||!pin){setLoginError("Enter your name and PIN to continue.");return}const btn=document.getElementById("loginBtn");btn.disabled=true;try{const res=await fetch(WORKER_URL+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:name,pin:pin})});const data=await res.json();if(!res.ok){setLoginError(data.error||"Sign in failed. Try again.");return}if(data.mustResetPin){pendingResetToken=data.resetToken;document.getElementById("reset-pin-welcome").textContent=`Hi ${data.user.name} — you signed in with a one-time PIN. Choose your own permanent one now.`;document.getElementById("login-screen").classList.add("hidden");document.getElementById("reset-pin-screen").classList.remove("hidden");return}if(!data.token){setLoginError(data.error||"Sign in failed. Try again.");return}if(!KNOWN_ROLES.includes(data.user.role)){setLoginError("This account is not set up for PULSE Pricing. Contact your admin.");return}sessionToken=data.token;currentUser=data.user;ssoActive=false;saveSessionToStorage();document.getElementById("login-screen").classList.add("hidden");document.getElementById("root").classList.remove("hidden");goTo("offers")}catch(e){setLoginError("Could not reach the server. Check your connection and try again.")}finally{btn.disabled=false}}async function tryHubSso(){const hubToken=getHubToken();if(!hubToken)return{result:"signed_out"};let res;try{res=await fetch(WORKER_URL+"/sso-login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({hubToken:hubToken})})}catch(e){return{result:"down"}}if(res.status===401)return{result:"signed_out"};const data=await res.json().catch(()=>null);const noAccess="Your account doesn't have access to PULSE Pricing. Contact your admin.";if(res.status===403)return{result:"no_access",message:data&&data.error||noAccess};if(!res.ok||!data||!data.token)return{result:"down"};if(!KNOWN_ROLES.includes(data.user&&data.user.role))return{result:"no_access",message:noAccess};completeSsoLogin(data);return{result:"ok"}}function completeSsoLogin(data){sessionToken=data.token;currentUser=data.user;ssoActive=true;saveSessionToStorage();document.getElementById("login-screen").classList.add("hidden");document.getElementById("root").classList.remove("hidden");goTo("offers");startAuthWatch()}function setResetPinError(message){const el=document.getElementById("reset-pin-error");if(message){el.textContent=message;el.style.display="block"}else{el.textContent="";el.style.display="none"}}async function submitNewPermanentPin(){const newPin=document.getElementById("newPermanentPin").value.trim();const confirmPin=document.getElementById("confirmPermanentPin").value.trim();setResetPinError(null);if(!newPin||newPin.length<6){setResetPinError("PIN must be at least 6 characters.");return}if(!/[a-zA-Z]/.test(newPin)||!/[0-9]/.test(newPin)){setResetPinError("PIN must contain at least one letter and one number.");return}if(newPin!==confirmPin){setResetPinError("PINs do not match.");return}const btn=document.getElementById("resetPinSubmitBtn");btn.disabled=true;try{const res=await fetch(WORKER_URL+"/api/auth/set-pin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({resetToken:pendingResetToken,newPin:newPin})});const data=await res.json();if(!res.ok||!data.token){setResetPinError(data.error||"Could not set your PIN. Try again.");return}pendingResetToken=null;if(!KNOWN_ROLES.includes(data.user.role)){setResetPinError("This account is not set up for PULSE Pricing. Contact your admin.");return}sessionToken=data.token;currentUser=data.user;saveSessionToStorage();document.getElementById("reset-pin-screen").classList.add("hidden");document.getElementById("root").classList.remove("hidden");render()}catch(e){setResetPinError("Could not reach the server. Check your connection and try again.")}finally{btn.disabled=false}}function initParticles(canvasId,opts){const canvas=document.getElementById(canvasId);if(!canvas)return;const ctx=canvas.getContext("2d");let w,h;function resize(){const rect=canvas.parentElement.getBoundingClientRect();w=canvas.width=rect.width;h=canvas.height=rect.height}resize();window.addEventListener("resize",resize);const dots=[];for(let i=0;i<opts.count;i++){dots.push({x:Math.random(),y:.55+Math.random()*.45,size:.6+Math.random()*1.4,phase:Math.random()*Math.PI*2})}let t=0;function frame(){t+=.006;ctx.clearRect(0,0,w,h);dots.forEach(d=>{const waveY=d.y*h+Math.sin(t*2+d.x*10+d.phase)*14;const alpha=.15+.35*Math.abs(Math.sin(t+d.phase));ctx.beginPath();ctx.arc(d.x*w,waveY,d.size,0,Math.PI*2);ctx.fillStyle=`rgba(47,217,168,${alpha})`;ctx.fill()});requestAnimationFrame(frame)}frame()}initParticles("login-particles",{count:140});initParticles("hero-particles",{count:60});const SERVICES=[{id:"verify",name:"VERIFY",pricingModel:"verify_tiered",staffPool:"consultants",segment:"vt",category:"compliance",desc:"Maintenance contract & certificate compliance oversight — invoice/proposal review, KPI scorecards, recovery tracking. Priced per the VERIFY tiered calculator."},{id:"ccm",name:"Certificate Compliance Management (CCM)",pricingModel:"unit_tiered",staffPool:"inspectors",segment:"vt",category:"compliance",desc:"AHJ inspection scheduling, witnessing, violation tracking, and fee/paperwork submission. Delivered by VDA’s Family of Inspection Companies. Priced per unit. Can stand alone or support the Inspection service below."},{id:"inspection",name:"Inspection",pricingModel:"per_ahj_category",staffPool:"inspectors",segment:"vt",category:"compliance",desc:"AHJ-witnessed inspection event — CAT 1, Periodic, CAT 3, CAT 5, etc. Priced per inspection category AND per Authority Having Jurisdiction, since requirements and fees vary by AHJ rather than by state or city. Rates are placeholder pending real VDA pricing input."},{id:"comp_eval",name:"Comprehensive Evaluation",pricingModel:"per_unit",staffPool:"consultants",segment:"vt",category:"evaluations",desc:"Full on-site equipment condition evaluation — one of three Equipment Evaluation variants, priced per unit."},{id:"qce",name:"Quality Control Evaluation (QCE)",pricingModel:"per_unit",staffPool:"consultants",segment:"vt",category:"evaluations",desc:"Second independent evaluation pass — Equipment Evaluation variant, priced per unit."},{id:"due_diligence",name:"Due Diligence",pricingModel:"per_unit",staffPool:"consultants",segment:"vt",category:"evaluations",desc:"Pre-acquisition / pre-contract equipment assessment — Equipment Evaluati perty,r.address,r.city,r.state,r.unit_id,r.equipment_type,r.floors_served]));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),"Units");const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});const file=new File([buf],"harborview-markets-demo-units.xlsx",{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});handlePortfolioFile({files:[file]})}const DEMO_TASK_LINES={modernization:[["Modernization Survey",48e3],["Technical Specification",36e3],["RFP / Bid Process",24e3]],construction:[["Site Visit - Punch List",6e3],["Site Visit - Final Review",6e3],["Site Visit - Additional",6e3]]};function demoTaskLines(svcId){return DEMO_TASK_LINES[svcId].map(([name,amount],i)=>({id:"tdemo"+svcId.slice(0,3)+i,name:name,amount:amount,qty:1,billingSplit:BILLING_SPLITS[0],trigger:TRIGGER_TYPES[0]}))}function demoAct(name){const w=state.wizard;if(!w)return;if(name==="portfolio"){if(w.offerType!=="portfolio")setWizard({offerType:"portfolio"});return}if(name.startsWith("svc-")){const id=name.slice(4);if(!w.selectedServices.includes(id))toggleService(id);return}if(name.startsWith("lines-")){const id=name.slice(6);setWizard({taskLines:{...w.taskLines,[id]:demoTaskLines(id)}});return}if(name.startsWith("deliverable-")){const id=name.slice(12);if(!w.deliverables.includes(id))toggleDeliverable(id);return}}function renderDemoActionBar(){const acts=["portfolio","svc-verify","svc-qce","svc-inspection","svc-modernization","svc-construction","lines-modernization","lines-construction","deliverable-proposaldoc","deliverable-estimate"];return`<div aria-hidden="true" style="position:absolute; left:0; top:0; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);">${acts.map(a=>`<button type="button" tabindex="-1" id="demo-act-${a}" onclick="demoAct('${a}')"></button>`).join("")}</div>`}const DEMO_FLOWS={p1:{id:"p1",version:"internal",title:"Portfolio Upload and Inspection",audience:"Prospects and leadership",minutes:4,wrap:`Next, the full scope: contract term, task lines and a volume discount.`,steps:[{go:"w1",target:".type-choice-card|Multiple properties",title:"Type and Client",say:`Every offer starts with who it is for and what kind of offer it is. Harborview Markets is a portfolio client, so we choose Portfolio and name the client. The market defaults to the United States; Canada and the United Kingdom are separate markets with their own rates.`,doit:`Choose Portfolio, then enter the client name.`,fill:[["#demo-act-portfolio","click"],["#w1-clientName",DEMO_CLIENT],["#w1-portfolioName","Harborview Portfolio"],["#w1-propertyCount","8"],["#w1-unitCountEstimate","20"]]},{go:"w2",target:"#demo-load-sample",click:true,title:"Portfolio Upload",say:`A portfolio is priced from a unit inventory. The client's list comes in as a spreadsheet with property, address, city, state, unit, equipment type and stops served. It is read here in the browser, and nothing is sent until you review the table.`,doit:`Choose the sample Harborview file, or use Fill it in for me.`,fill:[["#demo-load-sample","click"]]},{go:"w2",target:'select[style*="border-color"]',change:true,title:"Fix a Flagged Row",say:`One unit came in without its equipment type, so the row is flagged. This matters because a missing type would quietly price as hydraulic, and missing stops would price at the lowest band. You fix it right here in the table, instead of going back and uploading the whole file again.`,doit:`Pick the equipment type for the flagged unit.`,fill:[['select[style*="border-color"]',"Traction (Gearless)"]]},{go:"w3",target:"#svc-select-card",title:"Pick the Services",say:`Services are grouped by what they do. For Harborview we are pricing VERIFY, the Quality Control Evaluation, and Inspection. Each prices its own way: VERIFY by tiers, the evaluation per unit, and Inspection by jurisdiction. VERIFY and CCM cannot be combined, and the tool says so if you try.`,doit:`Select VERIFY, Quality Control Evaluation and Inspection.`,fill:[["#demo-act-svc-verify","click"],["#demo-act-svc-qce","click"],["#demo-act-svc-inspection","click"]]},{go:"w3",target:"#inspection-site-table",title:"California Is Left Out Automatically",say:`Inspection depends on the jurisdiction, so we look each property up. Harborview's sites are all in California, where we do not inspect. The tool excludes them on its own: the Can't inspect box is checked and locked, the note says why, and the cost columns read Excluded. The other services on those properties price normally. A salesperson sees 'Ask an admin if this needs an exception'.`,doit:`Click Look up jurisdiction for all properties, then Confirm all suggested, then read the note on a California row.`,fill:[["#inspection-lookup-btn","click"],["#inspection-confirm-all-btn","click"]]},{go:"w3",target:".sticky-side",title:"Live Estimate",say:`The Live Estimate updates as the offer changes. Inspection is absent because of the exclusion, and VERIFY and the evaluation are priced from the sample rate card. This is Year 1, exactly what the offer will save as its total.`,doit:`Look at the Live Estimate and find the Year 1 total.`}]},p2:{id:"p2",version:"internal",title:"Services, Discounts and Contract Term",audience:"Prospects and leadership",minutes:4,wrap:`Next, the documents: the Estimate Sheet and the Word proposal.`,steps:[{go:"w3",target:"#contract-term-select",change:true,title:"Contract Term",say:`Contract term is one setting for the whole offer. VERIFY and Inspection read it directly, and services with a year breakout default to it. Harborview is signing for three years.`,doit:`Set Contract Term to 3 years.`,fill:[["#contract-term-select","3"]]},{go:"w3",target:".service-row|Feasibility through deployment",title:"Modernization Services",say:`Modernization is priced per task, from the survey through the final site visits, rather than a single formula. The team picks the tasks in Select Tasks and enters an amount for each.`,doit:`Select Modernization Services, pick its tasks and enter an amount on the first one.`,fill:[["#demo-act-svc-modernization","click"],["#demo-act-lines-modernization","click"]]},{go:"w3",target:".service-row|Site visits (Punch List",title:"Construction Services",say:`Construction Services works the same way: the punch list visit, the final review and any additional visits, each as its own task, always listed in project order.`,doit:`Select Construction Services and pick its site visits.`,fill:[["#demo-act-svc-construction","click"],["#demo-act-lines-construction","click"]]},{go:"w3",target:"#discount-apply-toggle",change:"#discount-apply-chk",title:"Volume Discount",say:`A client with a large portfolio can earn a volume discount tied to how much of the portfolio VDA is awarded. The discount is off until someone applies it, and the tier chosen shows its effect live.`,doit:`Tick Apply discount and pick the tier.`,fill:[["#discount-apply-chk","on"]]},{go:"w3",target:".sticky-side",title:"Year 1 and Total Contract",say:`With a multi-year term the Live Estimate shows two sections. Year 1 is what saves as the offer total. Total Contract adds each service across all three years. The discount shows as its own line in both, so you can see what it is worth.`,doit:`Compare the Year 1 total with the Contract Total.`},{go:"w3",target:".sticky-side",title:"Contract Total After Discount",say:`The bottom line is the contract total after the discount. With a one-year term the two sections collapse into a single Estimated Total, so there is never two numbers to explain.`,doit:`Read the Contract Total (after discount).`}]},p3:{id:"p3",version:"internal",title:"Estimate Sheet and Word Proposal",audience:"Prospects and leadership",minutes:3,wrap:`That is the offer, priced from the rate cards. Nothing was saved or sent.`,steps:[{go:"w4",target:".deliverable-choice|Proposal (Word)",title:"Choose Documents",say:`Step 4 builds the documents. They are independent, so you can generate as many as you need. The Estimate Sheet is the pricing summary, and the Proposal is one combined Word document for every selected service.`,doit:`Select Proposal (Word) and Estimate Sheet.`,fill:[["#demo-act-deliverable-proposaldoc","click"],["#demo-act-deliverable-estimate","click"]]},{go:"w4",target:"#estimate-sheet-doc",title:"The Estimate Sheet",say:`The Estimate Sheet shows each service by contract year, with a total row, then the discount line and the total. Year 1 of that table always agrees with the pricing summary below it.`,doit:`Scroll to the Services Included table.`},{go:"w4",target:"#proposal-details-card",title:"The Proposal Details",say:`The proposal's pricing always comes from the offer. The wording that depends on the deal, such as dates, names and scope details, comes from this form. Anything left blank shows as a highlighted placeholder so it is easy to find in Word. For VERIFY there is also a one-time onboarding fee field, which sales can fill in, or enter zero to say it is waived.`,doit:`Fill in two details and watch the preview update.`,fill:[["#pd-contactSalutation","Ms."],["#pd-contactName","Carla Client (demo)"],["#pd-contactTitle","Director of Facilities"],["#pd-verifyOnboardingFee","0"]]},{go:"w4",target:"#proposal-doc",title:"Scroll the Proposal Preview",say:`This is the proposal as it will open in Word: title page, letter, scope for each service, the fee section, terms, signature page and the billing form. Scroll through it. The Download button gives an editable Word file, so the team can finish it in Word and print to PDF there.`,doit:`Scroll through the preview. Do not click Download.`},{go:"w4",target:".btn-primary|Confirm",title:"Stop Before Saving",say:`In real use, Confirm and Generate Offer saves the offer after the server re-prices it, so what is saved always matches the rates. In this demo nothing is saved or sent, so we stop here.`,doit:`Look at the disabled Confirm and Generate Offer button.`}]}};function demoShowMessage(message,canRetry){showEntryMessage(message,canRetry);const err=document.getElementById("login-error");if(err&&!document.getElementById("demo-back-link"))err.insertAdjacentHTML("afterend",'<p id="demo-back-link" style="margin-top:14px; font-size:13px;"><a href="/home/#/demo">Back to the Hub demo</a></p>')}function demoSessionEnded(){if(!demoMode||demoMode.over)return;demoMode.over=true;try{if(window.PulseDemoCoach&&window.PulseDemoCoach.running())window.PulseDemoCoach.end()}catch(e){}stopAuthWatch();demoShowMessage("This demo session has ended. Go back to the Hub demo to start it again.",false)}async function demoEndSession(){const t=sessionToken;sessionToken=null;if(!t)return;try{const ctl=new AbortController;const timer=setTimeout(function(){ctl.abort()},3e3);await fetch(WORKER_URL+"/logout",{method:"POST",headers:{Authorization:"Bearer "+t},keepalive:true,signal:ctl.signal});clearTimeout(timer)}catch(e){}}function demoLeave(story,chapter,done){stopAuthWatch();location.href="/home/#/demo"+(story?"?story="+encodeURIComponent(story)+"&chapter="+encodeURIComponent(chapter||"")+"&done="+(done?1:0):"")}function demoEndNow(){if(window.PulseDemoCoach&&window.PulseDemoCoach.running())window.PulseDemoCoach.end();else if(demoMode)demoEndSession().then(function(){demoLeave(demoMode.story,demoMode.chapter,false)})}function demoLoadCoach(){return new Promise(function(resolve,reject){if(window.PulseDemoCoach)return resolve();const s=document.createElement("script");s.src=DEMO_COACH_SRC;s.onload=function(){resolve()};s.onerror=function(){reject(new Error("coach"))};document.head.appendChild(s)})}async function demoPrepare(flowId){state.view="wizard";state.drawer=null;state.modal=null;state.wizard=freshWizardState();const w=state.wizard;w.expandedSegments={vt:true};w.expandedServiceCategories={"vt:compliance":true,"vt:evaluations":true,"vt:advisory":true};w.selectedServices=[];await ensureMarketListLoaded();await ensureAhjListLoaded();if(flowId==="p1"){render();return}Object.assign(w,{offerType:"portfolio",clientName:DEMO_CLIENT,portfolioName:"Harborview Portfolio",propertyCount:"8",unitCountEstimate:"20",uploadedSites:demoUnitRows(false),selectedServices:["verify","qce","inspection"],step:3});render();await lookupSiteAssignments();confirmAllSiteSuggestions();if(flowId==="p3"){setWizard({contractTermYears:3,discountApplied:true,selectedServices:["verify","qce","inspection","modernization","construction"],taskLines:{modernization:demoTaskLines("modernization"),construction:demoTaskLines("construction")},deliverables:["estimate"],step:4})}}async function demoWaitPricing(){const w=state.wizard;for(let i=0;i<80;i++){if(w.step<3)return;if(!w.pricingLoading&&w.pricingResult)return;await new Promise(function(r){setTimeout(r,100)})}}function demoStepNo(path){return parseInt(String(path||"").replace(/\D/g,""),10)||0}function demoGo(path){const n=demoStepNo(path),w=state.wizard;if(!n||!w)return;const patch={step:n};if(n>=2&&!w.offerType){patch.offerType="portfolio";patch.clientName=w.clientName||DEMO_CLIENT;patch.portfolioName=w.portfolioName||"Harborview Portfolio"}if(n>=3&&!(w.uploadedSites||[]).length)patch.uploadedSites=demoUnitRows(false);setWizard(patch);window.scrollTo({top:0})}function demoAt(step){const n=demoStepNo(step&&step.go);return!n||!!state.wizard&&state.wizard.step===n}async function startDemo(d){document.getElementById("login-screen").classList.add("hidden");if(!DEMO_FLOWS[d.flow]){demoShowMessage("That demo workflow is not part of PULSE Pricing.",false);return}if(!getHubToken()){if(!await getHubTokenFromOtherTabs(700)){location.replace("/login/?next="+encodeURIComponent(location.pathname+location.hash));return}}let res,data=null;try{res=await fetch(WORKER_URL+"/hub/demo/session",{method:"POST",headers:{Authorization:"Bearer "+getHubToken(),"Content-Type":"application/json"},body:JSON.stringify({flow:d.flow})});data=await res.json().catch(function(){return null})}catch(e){demoShowMessage("The demo can't be reached right now. Check your connection and try again.",true);return}if(res.status===401){location.replace("/login/?next="+encodeURIComponent(location.pathname+location.hash));return}if(res.status===403){demoShowMessage(data&&data.message||"The demo is for PULSE Hub Admins.",false);return}if(!res.ok||!data||!data.token){demoShowMessage(data&&data.message||"The demo could not start. Try again.",true);return}demoMode={flow:d.flow,practice:d.practice,from:d.from,story:d.story,chapter:d.chapter};sessionToken=data.token;currentUser=data.user;ssoActive=false;document.getElementById("root").classList.remove("hidden");startAuthWatch();try{await demoLoadCoach()}catch(e){demoShowMessage("The demo guide could not load. Try again.",true);return}await demoPrepare(d.flow);await demoWaitPricing();render();window.PulseDemoCoach.start({flow:DEMO_FLOWS[d.flow],practice:d.practice,endButtons:d.from==="hub"?[{key:"hub",label:"Back to the Hub demo",pri:true}]:undefined,go:demoGo,at:demoAt,escBlocked:function(){return!!(state.modal||state.showSignOut||state.helpOpen)},onEnd:async function(r){if(!demoMode||demoMode.over)return;demoMode.over=true;await demoEndSession();demoLeave(demoMode.story,demoMode.chapter,r.done)}})}function parseDemoHash(){const m=/^#\/demo\/([a-z0-9]+)(?:\?(.*))?$/i.exec(location.hash||"");if(!m)return null;const q=new URLSearchParams(m[2]||"");return{flow:m[1].toLowerCase(),practice:q.get("practice")==="1",from:q.get("from")||"",story:q.get("story")||"",chapter:q.get("chapter")||""}}window.addEventListener("load",async()=>{const demoLaunch=parseDemoHash();if(demoLaunch){startDemo(demoLaunch);return}if(!getHubToken()){if(!await getHubTokenFromOtherTabs(700)){goToHubLogin();return}}const sso=await tryHubSso();if(sso.result==="ok")return;if(sso.result==="signed_out"){authLost();return}if(sso.result==="no_access"){showEntryMessage(sso.message,false);return}if(tryRestoreSession())return;showEntryMessage("PULSE Pricing can't be reached right now. Check your connection and try again.",true)});</script>
