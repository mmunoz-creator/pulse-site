<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PULSE | Offline</title>
<style>
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:1.5rem;box-sizing:border-box;background:#f4f7fa;color:#092544;font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,sans-serif;text-align:center}
.box{max-width:340px;display:flex;flex-direction:column;align-items:center;gap:1rem}
.icon{width:64px;height:64px;border-radius:16px;background:#052242;display:grid;place-items:center}
h1{margin:0;font-size:1.5rem;font-weight:600;letter-spacing:-.03em}
p{margin:0;color:#4f6378;line-height:1.5}
button{min-height:48px;padding:0 1.6rem;border:0;border-radius:12px;background:#0a5fb4;color:#fff;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <span class="icon" aria-hidden="true"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3a9cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8l4 -16l3 8h4"/></svg></span>
  <h1>You're offline</h1>
  <p>PULSE needs a connection to show your platforms and data. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</div>
</body>
</html>
